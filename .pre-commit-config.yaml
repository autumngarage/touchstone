# Pre-commit hooks for the Touchstone itself (dogfooding).
# Install: pre-commit install --install-hooks

repos:
  # Standard hooks
  #
  # Cortex append-only exclusions: `.cortex/journal/` is append-only and
  # `.cortex/doctrine/` is immutable-with-supersede. Auto-fixing trailing
  # whitespace or final newlines in those files violates the Cortex Protocol
  # (§4.1, §4.2) — the entries' content must not change after original write.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.cortex/(journal|doctrine)/
      - id: end-of-file-fixer
        exclude: ^(\.cortex/(journal|doctrine)/|prototypes/)
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']
        stages: [pre-commit]

  # Run the same shellcheck-py the frozen downstream copies
  # pins, so any warning that would block a fresh scaffold's first push also
  # blocks ours. This closes the gap that bit us when sentinel's
  # A managed-file update once hit SC2120 in a script touchstone had just
  # synced — touchstone's own tests use system shellcheck (a different
  # version) and silently passed. completions/ and prototypes/ aren't shipped
  # to downstream, so they're excluded from this hook (zsh syntax, prototype
  # color constants).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        exclude: ^(completions/|prototypes/)

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        # Match the repo's existing 2-space shell style while making case blocks
        # and binary operators deterministic. Reject drift just like deterministic
        # preflight; omitting -d only prints formatted output and exits zero.
        args: ['-d', '-i', '2', '-ci', '-bn']
        exclude: ^(completions/|prototypes/)

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.46.0
    hooks:
      - id: markdownlint
        args: ['--config', '.markdownlint.json']
        files: ^([^/]+\.md|principles/.*\.md|audits/.*\.md|feedback/.*\.md)$
        exclude: ^\.cortex/

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$

  # Self-tests via the schema-v1 declaration engine used by the central
  # required workflow. Touchstone's .touchstone.toml declares the complete
  # tests/test-*.sh loop, so local and remote validation share one interpreter.
  - repo: local
    hooks:
      - id: touchstone-validate
        name: Touchstone project validation
        entry: >-
          /usr/bin/env env
          -u GIT_ALTERNATE_OBJECT_DIRECTORIES
          -u GIT_CONFIG -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT
          -u GIT_OBJECT_DIRECTORY -u GIT_DIR -u GIT_WORK_TREE
          -u GIT_IMPLICIT_WORK_TREE -u GIT_GRAFT_FILE -u GIT_INDEX_FILE
          -u GIT_NO_REPLACE_OBJECTS -u GIT_REPLACE_REF_BASE
          -u GIT_PREFIX -u GIT_SHALLOW_FILE -u GIT_COMMON_DIR
          -u GIT_NAMESPACE -u GIT_INTERNAL_GETTEXT_SH_SCHEME
          TOUCHSTONE_VALIDATE_SKIP_FEATURE_PUSH=1
          bash scripts/touchstone-run.sh validate
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
