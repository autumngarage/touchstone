[project]
name = "arpeggio"
version = "0.1.0"
description = "Backend-first AI matchmaking prototype"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.16.5,<2",
  "asyncpg>=0.30.0,<1",
  "boto3>=1.40.0,<2",
  "cryptography>=45.0.0,<47",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.0,<1",
  "openai>=1.99.0,<3",
  "pgvector>=0.4.1,<1",
  "pydantic-settings>=2.10.0,<3",
  "pyjwt[crypto]>=2.10.0,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17.0,<2",
  # Declared because scripts/check.sh runs it: `uv run` will not install an
  # undeclared executable, so without this the mandatory validation command
  # fails with "Failed to spawn: pre-commit" on a fresh clone that followed
  # the documented `uv sync` setup.
  "pre-commit>=4.0.0,<5",
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.0,<8",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/arpeggio"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = ["integration: requires a migrated PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106"]
"backend/alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["arpeggio"]
mypy_path = "backend"
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["backend/arpeggio"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
