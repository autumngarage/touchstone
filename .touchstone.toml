schema = 1

[tracker]
schema = 1
type = "linear"
key_prefix = "AUT"

[validation]
runtime = "bash"

[[validation.targets]]
name = "root"
path = "."

[[validation.tasks]]
name = "self-tests"
target = "root"
command = "for test in tests/test-*.sh; do echo \"==> $test\"; bash \"$test\" || exit 1; done"
required = true
