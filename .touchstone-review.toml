# .touchstone-review.toml — Conductor merge-review config for Touchstone itself.
#
# Touchstone dogfoods its own Conductor review hook.

[codex_review]
max_iterations = 3
max_diff_lines = 5000

# Touchstone dogfoods the read-only merge gate. Explicit local/dev runs can
# opt into autofix with CODEX_REVIEW_MODE=fix.
mode = "review-only"
safe_by_default = false

# Block the push when the reviewer crashes, times out, or returns malformed
# output. Touchstone PR #69 shipped a real blocking finding under fail-open
# because the reviewer hit a malformed-sentinel error mid-output — the
# finding was in the unparsed tail. Fail-closed errs toward "do not ship
# what we couldn't read." Emergency path: `git push --no-verify`, disclosed
# in the next PR per principles/git-workflow.md.
on_error = "fail-closed"

# Bootstrap and update scripts are high-scrutiny — a bug here propagates
# to every downstream project.
unsafe_paths = [
  "bootstrap/new-project.sh",
  "bootstrap/update-project.sh",
  "bootstrap/sync-all.sh",
  "hooks/conductor-review.sh",
  "hooks/codex-review.sh",
  "templates/",
]

[review.conductor]
# Live merge-gate review goes through Conductor's semantic review route:
# Conductor's semantic review route, with hosted fallback via Conductor.
# Ollama is reserved for
# explicit offline/local review only.
exclude = ["ollama"]

[review]
preflight_required = true
comment_on_clean = true
advisory_at_pr_open = false
comment_findings_history = true
high_scrutiny_mode = "peer"
high_scrutiny_paths = [
  "principles/",
  "hooks/",
  "lib/release.sh",
  "scripts/conductor-review.sh",
  "scripts/codex-review.sh",
  "bootstrap/",
  "templates/",
]
