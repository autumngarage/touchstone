# Touchstone delivery policy.
#
# Deterministic checks run locally, then the tier's bounded local pass
# (principles/local-review.md). PR-visible review remains the authority and is
# bound to the exact GitHub head and base revisions; Touchstone invokes no
# model router, and the local pass never gates a merge.

[review]
preflight_required = true

[review.local]
expected = true
provider = "coderabbit-cli"
command = "coderabbit review --agent --uncommitted"

[review.pr_triggered]
required = true
provider = "github-codex"
request_on_push = true
timeout_sec = 1800
poll_sec = 10
trusted_review_authors = ["chatgpt-codex-connector", "chatgpt-codex-connector[bot]"]
