# capabilities.toml — the scope ledger for Touchstone's executable surface.
#
# Every file under bin/, bootstrap/, hooks/, lib/, and scripts/ must appear
# here with a declared mission job. `tests/test-steering-size-caps.sh` fails
# when a file is present but unregistered, registered but absent, or declares
# a job it cannot support.
#
# The point is not bookkeeping. Touchstone's scope filter (TOUCHSTONE.md) is
# "does it constrain the agent, or merely serve it?" — a question that is easy
# to answer honestly when asked and easy to never ask at all. This file forces
# the question into a reviewed diff at the moment a capability is added.
#
# Repo-only. This file is NOT synced to downstream projects: it governs what
# Touchstone itself ships, and projects do not make Touchstone scope decisions.
#
# job values
#   constrain — stops the agent doing something it would otherwise do
#   legible   — puts state in git/PRs/issues where a human can verify it
#   carry     — gets the contract into every project and every agent
#   support   — shared helper with no standalone mission; requires `serves`
#               listing the registered non-support entries that depend on it
#   mirror    — byte-identical installed copy; requires `mirrors`
#   cut       — condemned, kept only until removal lands; requires `tracked`
#
# `why` is required on every entry and must say what the file does, not what
# category it belongs to. "constrains the agent" is not a why.

# ---------------------------------------------------------------- entry point

["bin/touchstone"]
job = "carry"
why = "The single command that installs, updates, and validates the contract in a project."

# ------------------------------------------------------------------ bootstrap

["bootstrap/new-project.sh"]
job = "carry"
why = "Seeds a project with the steering, hooks, scripts, and manifest that make the contract enforceable."

["bootstrap/update-project.sh"]
job = "carry"
why = "Propagates touchstone-owned files into an existing project so the contract does not drift behind the CLI."

["bootstrap/sync-all.sh"]
job = "carry"
why = "Applies update-project across every registered project so one contract change reaches all of them."

["bootstrap/migrate-from-toolkit.sh"]
job = "cut"
tracked = "#702"
why = "One-shot rename of .toolkit-* dotfiles for projects bootstrapped before v1.0.0. Unreachable in practice at v2.13.0."

# ---------------------------------------------------------------------- hooks

["hooks/branch-guard.sh"]
job = "constrain"
why = "Blocks a commit whose target worktree is on the default branch, at the tool boundary, before the commit happens."

["hooks/emergency-disclosure.sh"]
job = "constrain"
why = "Refuses an unaudited protected push and appends the audit record before authorizing the documented emergency path."

# ------------------------------------------------------------------ libraries

["lib/preflight.sh"]
job = "constrain"
why = "Runs the deterministic scope-aware validation that open-pr and merge-pr require before a push or a merge."

["lib/script-sync-guard.sh"]
job = "constrain"
why = "Refuses to ship when a project's vendored delivery scripts have drifted from the installed version."

["lib/sync-discipline.sh"]
job = "constrain"
why = "Bounds which paths a sync may write, so propagation cannot silently overwrite project-owned files."

["lib/sync-content.sh"]
job = "legible"
why = "Computes the one read-only content-currency verdict so update --check, auto-sync, sync-all --check, and status report the same truthful staleness state (#731)."

["lib/safe-write.sh"]
job = "constrain"
why = "Refuses to clobber a project-owned file during bootstrap or update."

["lib/status.sh"]
job = "legible"
why = "Reports delivery state from git and GitHub so the operator can verify it without trusting the agent."

["lib/touchstone-block.sh"]
job = "carry"
why = "Renders TOUCHSTONE.md into the managed block of AGENTS.md and GEMINI.md so every driver reads one contract."

["lib/claude-md-touchstone-ref.sh"]
job = "carry"
why = "Maintains the CLAUDE.md @-import so Claude Code sessions load the same steering as the other drivers."

["lib/install-hooks.sh"]
job = "carry"
why = "Installs the git and PreToolUse hooks that make the constraints active in a project checkout."

["lib/install-skills.sh"]
job = "carry"
why = "Installs the user-scoped skill bundle so the routing surface reaches Claude Code sessions."

["lib/auto-update.sh"]
job = "carry"
why = "Detects that the installed CLI has drifted ahead of a project's touchstone files and reports it."

["lib/release.sh"]
job = "carry"
why = "Publishes a version to GitHub Releases and the Homebrew tap so projects can install the contract."

["lib/preflight-scope.sh"]
job = "support"
serves = ["lib/preflight.sh"]
why = "Scope map that tells preflight which validators apply to a changed path."

["lib/toml.sh"]
job = "support"
serves = ["lib/preflight.sh", "scripts/merge-pr.sh", "scripts/open-pr.sh", "bin/touchstone"]
why = "Minimal TOML reader for .touchstone-config and .touchstone-review.toml."

["lib/issue-tracker.sh"]
job = "support"
serves = ["scripts/claim-issue.sh", "scripts/issue-claim-check.sh"]
why = "Resolves which tracker holds a project's issues and what a reference to one looks like, so the claim discipline is not GitHub-only."

["lib/sha256.sh"]
job = "support"
serves = ["lib/preflight.sh", "scripts/merge-pr.sh", "scripts/open-pr.sh", "bin/touchstone", "bootstrap/update-project.sh"]
why = "Portable SHA-256 adapter that fails closed when no backend is available."

["lib/sed-inplace.sh"]
job = "support"
serves = ["bin/touchstone", "bootstrap/new-project.sh", "bootstrap/update-project.sh"]
why = "Portable in-place sed shim replacing BSD-only `sed -i ''` so placeholder substitution works on GNU sed (PR #747)."

["lib/colors.sh"]
job = "support"
serves = ["bin/touchstone", "lib/status.sh", "lib/release.sh"]
why = "Terminal color and reset constants shared by the CLI and its reporters."

["lib/ui.sh"]
job = "support"
serves = ["bin/touchstone"]
why = "Banner and progress rendering for the CLI."

["lib/codex-auth.sh"]
job = "cut"
tracked = "#702"
why = "Subscription auth for Codex execution the product no longer does; no runtime consumer sources it, only manifests list the path."

["lib/events.sh"]
job = "cut"
tracked = "#694"
why = "NDJSON lifecycle events whose only consumer was the worker engine removed in PR #697."

# -------------------------------------------------------------------- scripts

["scripts/open-pr.sh"]
job = "constrain"
why = "Forces shipping through the PR path: validates, pushes, opens, requests exact-head review, and hands off to the merge gate."

["scripts/merge-pr.sh"]
job = "constrain"
why = "Refuses to merge without exact-head review evidence, resolved threads, verified issue claims, and clean required checks."

["scripts/issue-claim-check.sh"]
job = "constrain"
why = "Re-proves the issue-claim invariant from a hosted runner, independent of the local checkout."

["scripts/touchstone-run.sh"]
job = "constrain"
why = "Runs the project's declared lint, typecheck, and test tasks so validation is the same locally and in CI."

["scripts/spawn-worktree.sh"]
job = "constrain"
why = "Creates the isolated branch and worktree that parallel file-writing agents are required to use."

["scripts/respond-review.sh"]
job = "legible"
why = "Replies to a review finding and resolves its thread in one audited step, leaving the response on the PR."

["scripts/claim-issue.sh"]
job = "legible"
why = "Records an issue claim as an assignment and a comment before work starts, so two agents do not collide."

["scripts/release.sh"]
job = "carry"
why = "Project-side shim that runs the release helper from a project checkout."

["scripts/cleanup-branches.sh"]
job = "support"
serves = ["bin/touchstone"]
why = "Dry-run-first deletion of branches already merged; dispatched by the CLI via run_script_path."

["scripts/cleanup-worktrees.sh"]
job = "support"
serves = ["bin/touchstone"]
why = "Dry-run-first teardown of merged-or-equivalent worktrees; dispatched by the CLI via run_script_path."

["scripts/run-pytest-in-venv.sh"]
job = "cut"
tracked = "#702"
why = "Legacy pytest wrapper with no runtime consumer; touchstone-run.sh resolves the venv itself via find_python_bin."

["scripts/branch-guard.sh"]
job = "mirror"
mirrors = "hooks/branch-guard.sh"
why = "Installed copy of the branch guard that Touchstone runs against itself."

["scripts/emergency-disclosure.sh"]
job = "mirror"
mirrors = "hooks/emergency-disclosure.sh"
why = "Installed copy of the disclosure guard that Touchstone runs against itself."
