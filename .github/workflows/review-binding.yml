# review-binding — was THIS artifact reviewed?
#
# Publishes a check-run named "review-binding" on the PR's current head SHA.
# The check answers exactly one question: does trusted-author review evidence
# exist for the EXACT current head, bound to the EXACT current base? (#726.)
#
#   GREEN = trusted review evidence exists for the PR's current head (a formal
#           review whose commit oid equals the head, or the reviewer's result
#           comment naming the head — the same two channels the local merge
#           gate accepts), AND the review-request base binding recorded on
#           that head matches the PR's current base oid, AND the evidence
#           strictly postdates the trigger comment of the earliest COMPLETED
#           request binding that base (same-second ties fail closed —
#           second precision cannot prove ordering, the same rule
#           merge-pr.sh applies). Findings may exist
#           and be severe — the check is still green. This check never means
#           "approved" (trap 6, decision 2 on #744): the reviewer has emitted
#           zero APPROVED verdicts in 96 reviews, so gating on approval would
#           brick the repo. Required approvals stay zero; unresolved findings
#           are enforced by required conversation resolution, a separate gate.
#   RED   = no trusted review evidence at this head, or the base binding is
#           absent, conflicting, from an untrusted creator, or no longer
#           matching the PR's current base, or the request intent never
#           completed (no trusted trigger record pairs with it), or the only
#           evidence is from an untrusted author, or no evidence strictly
#           postdates the earliest completed request binding the current
#           base, or the head is simultaneously the head of multiple open
#           PRs. The output summary says which.
#
# Idempotent per head+base+evidence (issue #751): the conclusion is a pure
# function of (head oid, base oid, live evidence at that head). The freshness
# bound is the trigger timestamp of the EARLIEST completed request binding
# the current base, deliberately not the latest: measuring against the
# latest would let a re-request flip green back to red on a byte-identical
# head, the exact non-termination #751 measured. Re-requesting only appends
# LATER intent/trigger pairs, so it can never raise the earliest bar, and
# re-reviewing only adds evidence at the same oid.
# Evidence REMOVAL is different from re-requesting: a result comment that is
# edited or deleted takes accepted evidence away, and the check deliberately
# re-evaluates fail-closed on those events (see the issue_comment types
# below) — green flips red because the evidence is gone, not because the
# bar moved.
#
# Evidence sources (mirrors scripts/merge-pr.sh):
#   - formal reviews: GET /repos/{o}/{r}/pulls/{n}/reviews where commit_id ==
#     current head and user.login is on the trusted allowlist;
#   - result comments: trusted-author issue comments carrying
#     "Reviewed commit:" plus the backticked short head, resolved through the
#     commits API to the exact current head — the same comment channel
#     merge-pr.sh accepts in latest_trusted_pr_comment_result, and
#     verdict-agnostic here because this check binds artifacts, not verdicts;
#   - base binding: scripts/open-pr.sh records each review request on the
#     head as a PAIR of commit statuses. "touchstone/review-request-intent"
#     ("pr=<n> base=<oid>") is posted before the request;
#     "touchstone/review-request-complete" ("pr=<n> base=<oid> intent=<ts>
#     trigger=<ts>") is posted after the '@codex review' trigger comment
#     lands and carries that comment's timestamp. The bound base oid is
#     compared to the PR's current base oid. Freshness anchors to the
#     TRIGGER timestamp of the earliest completed request binding the
#     current base — never the intent timestamp: a review already in flight
#     for the PREVIOUS base can submit in the gap between a new request's
#     intent status and its trigger comment, and an intent-anchored bar
#     would accept it as fresh (merge-pr.sh gates on the same recorded
#     trigger timestamp, pairing each completion's intent= value with an
#     actual matching intent status). An intent with no matching trusted
#     completion is a red reason — the request never completed, so no
#     freshness anchor exists; merge-pr.sh refuses the same state. Status
#     creation proves only statuses:write — a GitHub App can hold that
#     without push access — so a request status counts only when its
#     CREATOR resolves to a write+ collaborator, the same rule merge-pr.sh
#     enforces; a request status for this PR from any other creator is a
#     red reason, never a binding.
#   - trusted-author allowlist: read per PR from the review config
#     (.touchstone-review.toml, then .codex-review.toml — merge-pr.sh's
#     filenames and precedence) at the PR's CURRENT BASE oid, which is
#     collaborator-writable content; the PR head's copy of the config is
#     never read. The [review.pr_triggered].trusted_review_authors value is
#     parsed with the same TOML-subset semantics as lib/toml.sh — the
#     canonical parser merge-pr.sh uses — reimplemented here because this
#     workflow may not check out or execute repo content;
#     tests/test-review-binding-workflow.sh extracts the parser and proves
#     it against lib/toml.sh on fixture configs. When no config file exists
#     at that base, the built-in default hardcoded in this file's env
#     applies — the same default merge-pr.sh carries. Reviews and comments
#     on a public repo are internet-writable, which is why the allowlist
#     may never come from PR-controlled files.
#   Exact-oid base semantics are inherited from the local merge gate; #734 may
#   relax this to an ancestry check later.
#
# Shared heads fail closed: check-runs attach to the COMMIT, not the PR, and
# external_id plays no part in required-check matching — so when one commit
# is simultaneously the head of several open PRs, a green published for the
# reviewed PR would satisfy the required check on every sibling. Whenever
# evaluation sees the head shared by more than one open PR, it publishes red
# for that head until the heads diverge.
#
# Triggers, and why each exists:
#   - pull_request_review (submitted, dismissed): a formal review submission
#     is delivered through this event, not issue_comment — without it a
#     finding-bearing review that posts no separate comment would never
#     re-evaluate, leaving a required check red forever. Dismissal changes
#     the evidence surface too, so it re-evaluates as well.
#   - issue_comment (created, edited, deleted), filtered to PR comments: the
#     reviewer's result comment channel, and the "@codex review" request
#     itself. edited/deleted exist because editing the marker out of (or
#     deleting) the only accepted result comment removes the evidence — the
#     check must re-evaluate fail-closed, not keep a green frozen on the
#     head.
#   - pull_request (synchronize, reopened, edited): synchronize makes every
#     new head start red; edited catches base retargeting.
#   - push (branches): when a base branch advances, the bindings of every open
#     PR targeting it go stale under exact-oid semantics while none of the
#     PR-scoped events fire — so a push re-evaluates every open PR whose base
#     ref is the pushed branch. The first MAX_BASE_SWEEP_PRS get a full
#     evaluation; every PR past the cap gets an explicit fail-closed red
#     (never a silently retained pre-push verdict) and recovers on its next
#     PR-scoped event. Push runs execute the pushed branch's copy of this
#     file, a surface writable only by collaborators.
#   - status: writing a "touchstone/review-request-*" commit status changes
#     this check's inputs on an unchanged head (an untrusted creator or a
#     conflicting base is a red reason) while firing NONE of the PR-scoped
#     events — without this trigger, a prior green would keep satisfying
#     branch protection even though re-evaluation would now fail, a state
#     merge-pr.sh independently rejects. Commit statuses are append-only,
#     so created is the only mutation. The job-level if filters to the two
#     review-request contexts (env is unavailable in job-level if, hence
#     the literals; the run block re-checks as defense in depth). Status
#     runs execute the DEFAULT branch's copy of this file — collaborator
#     controlled — and the fan-out is naturally bounded: only open PRs
#     whose head IS the status's commit re-evaluate, and two or more
#     sharing it fail closed under the shared-head guard anyway.
#
# Trap 7 (see the header of validate.yml): this workflow executes no
# PR-controlled code — there is no checkout of PR code AT ALL, no third-party
# actions, nothing derived from PR file contents. It only calls the GitHub API
# from this definition. The remaining caveat before making this check
# *required*: a pull_request event runs the PR's copy of this file, so the
# required-run pinning tracked in #727 applies to this check the same as to
# validate.
#
# Fork PRs: GITHUB_TOKEN is read-only there, so the pending check-run POST
# fails and the job errors WITHOUT publishing a verdict — inspection failure
# is never collapsed into a red (or green) conclusion.
#
# Publication lifecycle: every evaluation POSTs a fresh in_progress run of
# the name as soon as it knows the PR's live coordinates — BEFORE the
# fallible evidence inspection — then PATCHes that same run to completed
# with the verdict. Ordering matters: this run exists because something
# changed (evidence added or REMOVED, base moved, head pushed), so a
# mid-inspection API failure must not leave the pre-event verdict standing
# as the newest completed run of the name. With the pending run posted
# first, an inspection death leaves the check non-green (fail closed) until
# the next event or a re-run publishes a fresh verdict. The one residual
# window is the single PR-coordinates read before the pending POST: comment
# and status events carry no head SHA, so the head cannot be known any
# earlier than that one call. Branch protection and the PR UI read the
# newest run of the name, so runs update rather than stack.

name: review-binding

on:
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    # `opened` is load-bearing for the shared-head guard: an already-green
    # commit opened as a SECOND PR would inherit the first PR's commit-level
    # check without it, since no other event fires for the sibling
    # (PR #753 review, round 5).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['**']
  status:

permissions:
  checks: write
  pull-requests: read
  statuses: read
  contents: read

# A newer evaluation for the same PR (or same pushed ref, or same status
# commit) supersedes an in-flight one. Safe to cancel: every run re-reads
# live PR state, and the verdict is idempotent per (head, base, evidence),
# so the surviving run publishes the conclusion the cancelled one would
# have. A cancelled run can leave its pending check-run in_progress; the
# superseding run's own run is created later, and branch protection reads
# the newest run of the name, so the completed verdict still wins.
#
# PR-scoped and push-scoped runs live in DIFFERENT groups, so they can run
# concurrently against the same PR, and a PR-scoped run that read its
# coordinates before a base push could otherwise publish a verdict for the
# superseded base AFTER the push-triggered run published for the new one.
# Two guards close that: evaluate_pr re-reads the live head+base immediately
# before publishing and completes its run as cancelled when they moved (the
# move itself fired an event whose run owns the new coordinates); and
# because check-run recency follows creation order, the newer event's run —
# created after this one — is what branch protection reads even if this
# run's PATCH lands later. Status-scoped runs group per commit SHA so one
# status evaluation never cancels another head's.
concurrency:
  group: review-binding-${{ github.event.pull_request.number || github.event.issue.number || github.event.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Deliberately NOT named "review-binding" — neither this job KEY nor any
  # name: property: GitHub names a job's own check-run after the job, and a
  # job named review-binding would go green on every successful run — even
  # one that just published a FAILURE verdict — leaving two same-named
  # check-runs racing for what branch protection reads. The only check-run
  # named "review-binding" is the one this job POSTs.
  evaluate:
    name: evaluate
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'push' ||
      (github.event_name == 'status' &&
        (github.event.context == 'touchstone/review-request-intent' ||
         github.event.context == 'touchstone/review-request-complete')) ||
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      # The payload head, present on pull_request and pull_request_review
      # events and empty on issue comments. Passed as known_sha so the prior
      # verdict at that head is neutralized before the fallible coordinate
      # lookup — a retarget (edited) with an unchanged head otherwise leaves
      # the old base's green merge-eligible if the lookup fails
      # (PR #753 review, round 8).
      PR_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # status-event coordinates, passed through env and never interpolated
      # into the script: a status context is free text writable by any
      # statuses:write holder. Empty for every other event.
      STATUS_SHA: ${{ github.event.sha }}
      STATUS_CONTEXT: ${{ github.event.context }}
      # FALLBACK trusted-author allowlist, byte-identical to merge-pr.sh's
      # built-in default. The live allowlist is loaded per PR from the review
      # config at the PR's current base oid (see load_trusted_authors); this
      # value applies only when no config file exists at that base. It stays
      # hardcoded here because it may never come from PR-controlled files.
      TRUSTED_REVIEW_AUTHORS: "chatgpt-codex-connector,chatgpt-codex-connector[bot]"
      INTENT_STATUS_CONTEXT: touchstone/review-request-intent
      COMPLETE_STATUS_CONTEXT: touchstone/review-request-complete
      # Upper bound on how many open PRs one base push FULLY re-evaluates.
      # The observed open-PR count here is single-digit; 50 is an order of
      # magnitude of headroom. PRs past the cap are not skipped silently:
      # they get an explicit fail-closed red (publish_sweep_overflow), so
      # the cap bounds API cost without ever retaining a stale verdict.
      MAX_BASE_SWEEP_PRS: "50"
    steps:
      - name: Evaluate binding and publish the check-run
        run: |
          set -euo pipefail

          # Reads TRUSTED_AUTHORS_EFFECTIVE from the calling evaluate_pr via
          # dynamic scoping — the per-PR allowlist, not the env fallback.
          author_is_trusted() {
            local candidate="$1" item
            local -a items
            IFS=',' read -r -a items <<<"$TRUSTED_AUTHORS_EFFECTIVE"
            for item in "${items[@]}"; do
              if [ "$item" = "$candidate" ]; then
                return 0
              fi
            done
            return 1
          }

          # Appends to the caller's local 'reasons' via dynamic scoping.
          add_reason() {
            reasons="${reasons}${reasons:+$'\n'}- $1"
          }

          # >>> parity-tested: record_untrusted_creator >>>
          # Appends the normalized label for an untrusted review-request
          # status creator to the caller's untrusted_request_creators list
          # (dynamic scoping), once per label. Normalization happens BEFORE
          # deduplication: an empty login (e.g. a deleted principal) must
          # become <unknown> first — a raw empty string turns the dedup
          # pattern into ",,", which matches the empty list's ",," and
          # silently drops the first unknown creator, letting a trusted
          # sibling status turn the check green while merge-pr.sh rejects
          # the head. tests/test-review-binding-workflow.sh extracts this
          # function verbatim and regression-tests that exact case.
          record_untrusted_creator() {
            local creator_label="${1:-<unknown>}"
            case ",$untrusted_request_creators," in
              *",$creator_label,"*) ;;
              *) untrusted_request_creators="${untrusted_request_creators}${untrusted_request_creators:+,}$creator_label" ;;
            esac
          }
          # <<< parity-tested: record_untrusted_creator <<<

          # >>> parity-tested: parse_trusted_review_authors >>>
          # Reads a review-config TOML document on stdin and prints the
          # [review.pr_triggered] trusted_review_authors array as a comma-
          # separated list; exits 3 when the key is absent. This is a
          # deliberate REIMPLEMENTATION of the lib/toml.sh subset relevant
          # to this one key — the workflow may not check out or execute
          # repo content, so it cannot source the canonical parser — kept
          # semantically identical: quote-aware inline-comment stripping,
          # single-/double-quoted and bare items, multiline arrays joined
          # to the first unquoted ']', empty items dropped, last key wins.
          # tests/test-review-binding-workflow.sh extracts this function
          # verbatim and proves it against lib/toml.sh on fixture configs.
          parse_trusted_review_authors() {
            awk '
              function trim(s) {
                sub(/^[[:space:]]+/, "", s)
                sub(/[[:space:]]+$/, "", s)
                return s
              }
              # toml_strip_comment parity: drop everything from the first #
              # outside quotes; backslash escapes the next char inside
              # double quotes only.
              function strip_comment(line,  out, i, c, len, in_s, in_d) {
                out = ""; in_s = 0; in_d = 0; len = length(line)
                for (i = 1; i <= len; i++) {
                  c = substr(line, i, 1)
                  if (in_d && c == "\\") {
                    out = out c
                    i++
                    if (i <= len) out = out substr(line, i, 1)
                    continue
                  }
                  if (c == "\"" && !in_s) in_d = !in_d
                  else if (c == "\047" && !in_d) in_s = !in_s
                  else if (c == "#" && !in_s && !in_d) break
                  out = out c
                }
                return out
              }
              # toml_array_content_before_close parity: position of the
              # first ] outside quotes; 0 while the array stays open.
              function close_idx(s,  i, c, len, in_s, in_d) {
                in_s = 0; in_d = 0; len = length(s)
                for (i = 1; i <= len; i++) {
                  c = substr(s, i, 1)
                  if (in_d && c == "\\") { i++; continue }
                  if (c == "\"" && !in_s) in_d = !in_d
                  else if (c == "\047" && !in_d) in_s = !in_s
                  else if (c == "]" && !in_s && !in_d) return i
                }
                return 0
              }
              # toml_unquote parity: strip one layer of matching single or
              # double quotes.
              function unquote(s,  f, l) {
                s = trim(s)
                if (length(s) >= 2) {
                  f = substr(s, 1, 1)
                  l = substr(s, length(s), 1)
                  if ((f == "\"" && l == "\"") || (f == "\047" && l == "\047")) {
                    return substr(s, 2, length(s) - 2)
                  }
                }
                return s
              }
              # toml_normalize_array parity: split on commas, trim+unquote
              # items, drop empties, join with commas. Quoted commas inside
              # items are unsupported by the canonical parser too.
              function record(content,  n, parts, i, item, outv) {
                n = split(content, parts, ",")
                outv = ""
                for (i = 1; i <= n; i++) {
                  item = unquote(trim(parts[i]))
                  if (item == "") continue
                  outv = outv (outv == "" ? "" : ",") item
                }
                result = outv
                found = 1
              }
              {
                line = trim(strip_comment($0))
                if (line == "") next
                # Section headers are recognized BEFORE array continuation,
                # exactly as toml_parse orders its checks.
                if (substr(line, 1, 1) == "[" && substr(line, length(line), 1) == "]") {
                  section = trim(substr(line, 2, length(line) - 2))
                  in_array = 0
                  capturing = 0
                  next
                }
                if (in_array) {
                  ci = close_idx(line)
                  if (ci) {
                    if (capturing) record(buf " " substr(line, 1, ci - 1))
                    in_array = 0
                    capturing = 0
                    buf = ""
                  } else {
                    buf = buf " " line
                  }
                  next
                }
                eq = index(line, "=")
                if (eq == 0) next
                key = trim(substr(line, 1, eq - 1))
                val = trim(substr(line, eq + 1))
                is_target = (section == "review.pr_triggered" && key == "trusted_review_authors")
                if (substr(val, 1, 1) == "[") {
                  rest = substr(val, 2)
                  ci = close_idx(rest)
                  if (ci) {
                    if (is_target) record(substr(rest, 1, ci - 1))
                  } else {
                    in_array = 1
                    capturing = is_target
                    buf = rest
                  }
                } else if (is_target) {
                  record(unquote(val))
                }
              }
              END {
                if (found) {
                  print result
                  exit 0
                }
                exit 3
              }
            '
          }
          # <<< parity-tested: parse_trusted_review_authors <<<

          # Sets TRUSTED_AUTHORS_EFFECTIVE / TRUSTED_AUTHORS_SOURCE in the
          # caller (dynamic scoping): the [review.pr_triggered]
          # trusted_review_authors array from the first review-config file
          # present at the PR's current BASE oid — merge-pr.sh's filenames,
          # precedence, and built-in default. Base-branch content is
          # collaborator-writable only; the PR head's copy is never read.
          # A file present with the key absent keeps the default (as
          # merge-pr.sh does); a key present but empty trusts nobody (fail
          # closed). 404 falls through; any other read or parse failure
          # aborts the job — after the pending run was posted, so the check
          # stays non-green rather than retaining a pre-event verdict.
          load_trusted_authors() {
            local base_oid_arg="$1" cfg_path raw err_file value parse_status
            TRUSTED_AUTHORS_EFFECTIVE="$TRUSTED_REVIEW_AUTHORS"
            TRUSTED_AUTHORS_SOURCE="built-in default"
            for cfg_path in .touchstone-review.toml .codex-review.toml; do
              err_file="$(mktemp)"
              if raw="$(gh api -H "Accept: application/vnd.github.raw+json" \
                "repos/$REPO/contents/$cfg_path?ref=$base_oid_arg" 2>"$err_file")"; then
                rm -f "$err_file"
              elif grep -q "HTTP 404" "$err_file"; then
                rm -f "$err_file"
                continue
              else
                echo "ERROR: could not read $cfg_path at base $base_oid_arg; not publishing." >&2
                cat "$err_file" >&2
                rm -f "$err_file"
                exit 1
              fi
              parse_status=0
              value="$(printf '%s\n' "$raw" | parse_trusted_review_authors)" || parse_status=$?
              if [ "$parse_status" -eq 0 ]; then
                TRUSTED_AUTHORS_EFFECTIVE="$value"
                TRUSTED_AUTHORS_SOURCE="$cfg_path @ base $base_oid_arg"
              elif [ "$parse_status" -ne 3 ]; then
                echo "ERROR: failed to parse trusted_review_authors from $cfg_path at base $base_oid_arg (exit $parse_status); not publishing." >&2
                exit 1
              fi
              return 0
            done
          }

          # Commit statuses can be written by principals holding only
          # statuses:write (e.g. a GitHub App) — status creation alone does
          # not prove push access. Resolve each accepted request-status
          # creator to their live collaborator permission and require
          # write/maintain/admin, exactly as merge-pr.sh does. HTTP 404 is a
          # definitive "not a collaborator" (untrusted — a red reason, fail
          # closed); any other lookup failure is an inspection failure and
          # aborts the job, leaving the pending run non-green.
          CREATOR_PERM_CACHE="|"
          creator_has_push_access() {
            local login="$1" perm err_file
            [ -n "$login" ] || return 1
            case "$CREATOR_PERM_CACHE" in
              *"|$login=trusted|"*) return 0 ;;
              *"|$login=untrusted|"*) return 1 ;;
            esac
            err_file="$(mktemp)"
            if perm="$(gh api "repos/$REPO/collaborators/$login/permission" \
              --jq '.permission' 2>"$err_file")"; then
              rm -f "$err_file"
            elif grep -q "HTTP 404" "$err_file"; then
              rm -f "$err_file"
              perm="none"
            else
              echo "ERROR: could not resolve collaborator permission for '$login'; not publishing." >&2
              cat "$err_file" >&2
              rm -f "$err_file"
              exit 1
            fi
            case "$perm" in
              admin | maintain | write)
                CREATOR_PERM_CACHE="${CREATOR_PERM_CACHE}${login}=trusted|"
                return 0
                ;;
              *)
                CREATOR_PERM_CACHE="${CREATOR_PERM_CACHE}${login}=untrusted|"
                return 1
                ;;
            esac
          }

          # Run "$@" in a subshell that PRESERVES errexit and report the status
          # via ISOLATED_RC. The obvious `if ! evaluate_pr` form suppresses
          # set -e through the entire function body (bash ignores re-enables
          # inside any tested context), so an inner API failure could fall
          # through to a successful return — an isolation wrapper that records
          # no failure (PR #753 review, round 6). The subshell below is NOT a
          # tested command, so its internal set -e is honored.
          ISOLATED_RC=0
          run_isolated() {
            ISOLATED_RC=0
            set +e
            ( set -e; "$@" )
            ISOLATED_RC=$?
            set -e
          }

          evaluate_pr() {
            local pr_number="$1" known_sha="${2:-}"
            # Sweep and status paths already KNOW the affected SHA before any
            # fallible call — so the previous verdict at that SHA is
            # neutralized FIRST, and a coordinate-lookup failure below can no
            # longer leave a stale green standing (PR #753 review, round 7).
            # Comment/PR events pass no SHA: for them the lookup below is
            # genuinely the earliest the head can be known.
            if [ -n "$known_sha" ]; then
              gh api -X POST "repos/$REPO/check-runs" \
                -f name=review-binding \
                -f head_sha="$known_sha" \
                -f status=in_progress \
                -f "output[title]=Evaluating review binding" \
                -f "output[summary]=An event invalidated the previous verdict for head \`$known_sha\` (PR #$pr_number). If this run dies before completing, the check stays non-green (fail closed)." \
                --jq '.id' >/dev/null
            fi
            # Live PR coordinates, not the event payload: comment events carry
            # no head SHA, and idempotence means evaluating the PR as it is
            # now. For known-SHA callers the previous verdict is already
            # neutralized above; for the rest, a failure here errors the job
            # without publishing (the head cannot be known any earlier).
            local pr_json pr_state head_sha base_oid base_ref
            pr_json="$(gh api "repos/$REPO/pulls/$pr_number")"
            pr_state="$(jq -r '.state // ""' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
            base_oid="$(jq -r '.base.sha // ""' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref // ""' <<<"$pr_json")"
            if [ -z "$head_sha" ] || [ -z "$base_oid" ]; then
              echo "ERROR: incomplete PR #$pr_number coordinates (head='$head_sha' base='$base_oid'); not publishing." >&2
              return 1
            fi
            if [ "$pr_state" != "open" ]; then
              echo "PR #$pr_number is $pr_state; out of scope for the merge gate. Publishing nothing."
              return 0
            fi

            # Neutralize any previously published verdict BEFORE the fallible
            # evidence inspection: this run exists because something changed
            # (evidence added or removed, base moved, head pushed), so a
            # mid-inspection API failure must not leave the pre-event verdict
            # standing as the newest completed run of the name. A run that
            # dies past this point leaves this in_progress run non-green —
            # fail closed — until the next event or a re-run publishes a
            # fresh verdict. The verdict PATCHes this same run to completed.
            local run_id
            run_id="$(gh api -X POST "repos/$REPO/check-runs" \
              -f name=review-binding \
              -f head_sha="$head_sha" \
              -f status=in_progress \
              -f "output[title]=Evaluating review binding" \
              -f "output[summary]=Re-evaluating trusted-review binding for PR #$pr_number at head \`$head_sha\`. If this run dies before completing, the check stays non-green (fail closed); the next event or a re-run publishes a fresh verdict." \
              --jq '.id')"

            local TRUSTED_AUTHORS_EFFECTIVE="" TRUSTED_AUTHORS_SOURCE=""
            load_trusted_authors "$base_oid"

            # Shared heads: check-runs attach to the commit, not the PR, so a
            # verdict for one PR satisfies a required check on every open PR
            # sharing this head. Fail closed until the heads diverge.
            local co_head_prs co_head_count
            co_head_prs="$(gh api --paginate "repos/$REPO/commits/$head_sha/pulls?per_page=100" \
              --jq ".[] | select(.state == \"open\" and .head.sha == \"$head_sha\") | .number" \
              | sort -un | sed 's/^/#/' | paste -sd' ' -)"
            co_head_count="$(printf '%s\n' "$co_head_prs" | wc -w | tr -d ' ')"

            # Base binding recorded on the head by scripts/open-pr.sh: intent
            # statuses bind pr+base; complete statuses pair a recorded intent
            # with the '@codex review' trigger comment's timestamp. The
            # trigger of the earliest completed request binding the CURRENT
            # base anchors freshness — an intent-anchored bar would accept a
            # review that was already in flight for the previous base when
            # the new request was recorded (it can submit between the new
            # intent and its trigger comment). merge-pr.sh gates on the same
            # recorded trigger timestamps.
            local statuses_tsv bound_bases matching_intent_ats completion_rows
            local earliest_matching_trigger_at untrusted_request_creators
            local context status_state created_at status_creator description
            local request_pr request_base intent_ref trigger_at
            statuses_tsv="$(gh api --paginate "repos/$REPO/commits/$head_sha/statuses?per_page=100" \
              --jq '.[] | [(.context // "<none>"), (.state // "<none>"), (.created_at // "<none>"), ((.creator.login // "") | if . == "" then "<none>" else . end), ((.description // "") | gsub("[\r\n\t]"; " ") | if . == "" then "<none>" else . end)] | @tsv')"
            bound_bases=""
            matching_intent_ats=""
            completion_rows=""
            untrusted_request_creators=""
            # Every field above is sentinel-filled ("<none>") rather than
            # empty: tab is IFS whitespace, so read COLLAPSES adjacent tabs —
            # an empty creator.login (deleted principal) would shift the
            # description into status_creator and skip the untrusted-creator
            # record entirely (PR #753 review, round 9).
            while IFS=$'\t' read -r context status_state created_at status_creator description || [ -n "$context" ]; do
              case "$context" in
                "$INTENT_STATUS_CONTEXT")
                  case "$description" in
                    pr=*' base='*) ;;
                    *) continue ;;
                  esac
                  ;;
                "$COMPLETE_STATUS_CONTEXT")
                  case "$description" in
                    pr=*' base='*' intent='*' trigger='*) ;;
                    *) continue ;;
                  esac
                  ;;
                *) continue ;;
              esac
              [ "$status_state" = "success" ] || continue
              request_pr="${description#pr=}"
              request_pr="${request_pr%% base=*}"
              [ "$request_pr" = "$pr_number" ] || continue
              if [ "$status_creator" = "<none>" ] || ! creator_has_push_access "$status_creator"; then
                record_untrusted_creator "$status_creator"
                continue
              fi
              request_base="${description#* base=}"
              if [ "$context" = "$COMPLETE_STATUS_CONTEXT" ]; then
                request_base="${request_base%% intent=*}"
              fi
              case ",$bound_bases," in
                *",$request_base,"*) ;;
                *) bound_bases="${bound_bases}${bound_bases:+,}$request_base" ;;
              esac
              [ "$request_base" = "$base_oid" ] || continue
              if [ "$context" = "$INTENT_STATUS_CONTEXT" ]; then
                [ -n "$created_at" ] || continue
                matching_intent_ats="${matching_intent_ats}${matching_intent_ats:+$'\n'}$created_at"
              else
                intent_ref="${description#* intent=}"
                intent_ref="${intent_ref%% trigger=*}"
                trigger_at="${description##* trigger=}"
                { [ -n "$intent_ref" ] && [ -n "$trigger_at" ]; } || continue
                completion_rows="${completion_rows}${completion_rows:+$'\n'}$intent_ref"$'\t'"$trigger_at"
              fi
            done <<<"$statuses_tsv"

            # A completion's trigger counts only when its recorded intent=
            # timestamp matches an actual trusted intent status binding the
            # same base — merge-pr.sh's pairing rule. The EARLIEST such
            # trigger anchors freshness (idempotence, #751: re-requesting
            # appends later pairs and can never raise this bar).
            earliest_matching_trigger_at=""
            while IFS=$'\t' read -r intent_ref trigger_at || [ -n "$intent_ref" ]; do
              [ -n "$intent_ref" ] || continue
              printf '%s\n' "$matching_intent_ats" | grep -Fxq "$intent_ref" || continue
              if [ -z "$earliest_matching_trigger_at" ] || [[ "$trigger_at" < "$earliest_matching_trigger_at" ]]; then
                earliest_matching_trigger_at="$trigger_at"
              fi
            done <<<"$completion_rows"

            local reasons="" binding_ok=false threshold=""
            if [ "$co_head_count" -gt 1 ]; then
              add_reason "head \`$head_sha\` is simultaneously the head of $co_head_count open PRs ($co_head_prs): check-runs bind to commits, not PRs, so one PR's verdict would satisfy every sibling's required check — failing closed until the heads diverge"
            fi
            if [ -n "$untrusted_request_creators" ]; then
              add_reason "head \`$head_sha\` carries review-request status(es) (\`$INTENT_STATUS_CONTEXT\` / \`$COMPLETE_STATUS_CONTEXT\`) for PR #$pr_number from creator(s) without push access (\`$untrusted_request_creators\`) — status creation proves only statuses:write, so these cannot bind a base (the same write+ creator rule merge-pr.sh enforces)"
            fi
            if [ -z "$bound_bases" ]; then
              add_reason "no base binding: no successful \`$INTENT_STATUS_CONTEXT\` status on head \`$head_sha\` from a write+ collaborator records \`pr=$pr_number base=<oid>\`"
            elif [ "${bound_bases#*,}" != "$bound_bases" ]; then
              add_reason "conflicting base bindings on head \`$head_sha\`: \`$bound_bases\` (current base \`$base_ref\` is at \`$base_oid\`)"
            elif [ "$bound_bases" != "$base_oid" ]; then
              add_reason "base binding mismatch: review was requested against base \`$bound_bases\`, but PR #$pr_number now targets \`$base_ref\` at \`$base_oid\`"
            elif [ -z "$earliest_matching_trigger_at" ]; then
              add_reason "the review request binding base \`$base_oid\` never completed: no trusted \`$COMPLETE_STATUS_CONTEXT\` status pairs a recorded intent with its trigger-comment timestamp, so there is no freshness anchor (merge-pr.sh refuses the same state) — re-run scripts/open-pr.sh to complete the request"
            else
              binding_ok=true
              threshold="$earliest_matching_trigger_at"
            fi

            # Trusted review evidence bound to the exact current head.
            # Channel 1: formal reviews whose commit oid equals the head.
            local evidence="" untrusted_reviews=0
            local reviews_tsv author commit_oid review_state submitted_at
            reviews_tsv="$(gh api --paginate "repos/$REPO/pulls/$pr_number/reviews?per_page=100" \
              --jq '.[] | [(.user.login // ""), (.commit_id // ""), (.state // ""), (.submitted_at // "")] | @tsv')"
            while IFS=$'\t' read -r author commit_oid review_state submitted_at || [ -n "$author" ]; do
              [ -n "$author" ] || continue
              [ "$commit_oid" = "$head_sha" ] || continue
              if author_is_trusted "$author"; then
                [ -n "$submitted_at" ] || continue
                evidence="${evidence}${evidence:+$'\n'}$submitted_at"$'\t'"formal review by @$author ($review_state) at $submitted_at"
              else
                untrusted_reviews=$((untrusted_reviews + 1))
              fi
            done <<<"$reviews_tsv"

            # Channel 2: the reviewer's result comment naming the exact head
            # (same surface merge-pr.sh accepts). Verdict-agnostic: clean or
            # finding-bearing, the artifact was reviewed either way. The
            # short oid is resolved through the commits API and must equal
            # the full current head.
            local comments_tsv head_short comment_head_resolved=false resolved_commit="" body
            head_short="$(printf '%.10s' "$head_sha")"
            comments_tsv="$(gh api --paginate "repos/$REPO/issues/$pr_number/comments?per_page=100" \
              --jq '.[] | [(.user.login // ""), (.created_at // ""), ((.body // "") | gsub("[\r\n\t]"; " "))] | @tsv')"
            while IFS=$'\t' read -r author created_at body || [ -n "$author" ]; do
              [ -n "$author" ] || continue
              author_is_trusted "$author" || continue
              [ -n "$created_at" ] || continue
              case "$body" in
                *"Reviewed commit:"*"\`$head_short\`"*) ;;
                *) continue ;;
              esac
              if [ "$comment_head_resolved" = false ]; then
                resolved_commit="$(gh api "repos/$REPO/commits/$head_short" --jq '.sha')"
                comment_head_resolved=true
              fi
              [ "$resolved_commit" = "$head_sha" ] || continue
              evidence="${evidence}${evidence:+$'\n'}$created_at"$'\t'"result comment by @$author at $created_at"
            done <<<"$comments_tsv"

            # Count evidence; when the binding is valid, only evidence
            # STRICTLY after the earliest completed request's trigger counts.
            # Same-second ties fail closed: GitHub timestamps have second
            # precision, and "same second" cannot prove the evidence followed
            # the request — the same rule merge-pr.sh applies.
            local total_evidence=0 qualifying=0 latest_ts="" latest_detail="" ts detail
            while IFS=$'\t' read -r ts detail || [ -n "$ts" ]; do
              [ -n "$ts" ] || continue
              total_evidence=$((total_evidence + 1))
              if [ "$binding_ok" = true ] && [ -n "$threshold" ] && ! [[ "$ts" > "$threshold" ]]; then
                continue
              fi
              qualifying=$((qualifying + 1))
              if [ -z "$latest_ts" ] || [[ "$ts" > "$latest_ts" ]]; then
                latest_ts="$ts"
                latest_detail="$detail"
              fi
            done <<<"$evidence"

            if [ "$total_evidence" -eq 0 ]; then
              if [ "$untrusted_reviews" -gt 0 ]; then
                add_reason "the only review evidence at head \`$head_sha\` is from untrusted author(s) ($untrusted_reviews review(s) not on the allowlist: ${TRUSTED_AUTHORS_EFFECTIVE:-<empty>})"
              else
                add_reason "no trusted-author review evidence (formal review or result comment) exists for head \`$head_sha\`"
              fi
            elif [ "$binding_ok" = true ] && [ "$qualifying" -eq 0 ]; then
              add_reason "no trusted review evidence at head \`$head_sha\` strictly postdates the trigger of the earliest completed request binding base \`$base_oid\` ($threshold; same-second ties fail closed) — a review begun before that request can predate its trigger and may have reviewed a different diff"
            fi

            local external_id=""
            case "$bound_bases" in
              *,*) : ;;
              ?*) external_id="$bound_bases" ;;
            esac

            local coords footer conclusion title summary
            coords=$'\n'"- head: \`$head_sha\`"$'\n'"- current base: \`$base_ref\` @ \`$base_oid\`"$'\n'"- trusted authors: \`${TRUSTED_AUTHORS_EFFECTIVE:-<none>}\` ($TRUSTED_AUTHORS_SOURCE)"
            footer=$'\n\n'"This check answers \"was this exact artifact reviewed\", never \"was it approved\"; unresolved findings are enforced by required conversation resolution, not here (#726)."
            if [ -z "$reasons" ]; then
              conclusion="success"
              title="Reviewed at this head, bound to the current base"
              summary="Trusted review evidence exists for the exact current head, strictly after the earliest completed request that bound the PR's current base.$coords"$'\n'"- evidence: $latest_detail (qualifying evidence at this head: $qualifying)"$'\n'"- earliest completed request trigger for this base: $threshold$footer"
            else
              conclusion="failure"
              title="Not reviewed at this head+base"
              summary="This head+base pair has no binding trusted-review evidence:"$'\n\n'"$reasons"$'\n'"$coords"$'\n\n'"To turn this green, request a trusted review for this exact head (bash scripts/open-pr.sh) and let it complete.$footer"
            fi

            # Publish-time revalidation (cross-concurrency guard, see the
            # concurrency comment): if head or base moved — or the PR closed
            # — since this evaluation read them, this verdict describes
            # superseded coordinates. The move itself fired an event whose
            # run owns the new coordinates; complete this pending run as
            # cancelled (a non-success conclusion, so even if it somehow
            # ends up newest it fails closed until the next event).
            local live_json live_state live_head live_base
            live_json="$(gh api "repos/$REPO/pulls/$pr_number")"
            live_state="$(jq -r '.state // ""' <<<"$live_json")"
            live_head="$(jq -r '.head.sha // ""' <<<"$live_json")"
            live_base="$(jq -r '.base.sha // ""' <<<"$live_json")"
            if [ "$live_state" != "open" ] || [ "$live_head" != "$head_sha" ] || [ "$live_base" != "$base_oid" ]; then
              echo "PR #$pr_number moved during evaluation (now state=$live_state head=$live_head base=$live_base; evaluated head=$head_sha base=$base_oid); completing run $run_id as cancelled — the run for the new coordinates supersedes this one."
              gh api -X PATCH "repos/$REPO/check-runs/$run_id" \
                -f status=completed \
                -f conclusion=cancelled \
                -f "output[title]=Superseded during evaluation" \
                -f "output[summary]=PR #$pr_number's coordinates moved while this run was evaluating (now state=$live_state head=\`$live_head\` base=\`$live_base\`; evaluated head=\`$head_sha\` base=\`$base_oid\`). The event fired by that move owns the fresh verdict; this run publishes none." \
                >/dev/null
              return 0
            fi

            gh api -X PATCH "repos/$REPO/check-runs/$run_id" \
              -f status=completed \
              -f conclusion="$conclusion" \
              -f external_id="$external_id" \
              -f "output[title]=$title" \
              -f "output[summary]=$summary" \
              >/dev/null
            echo "Published check-run review-binding id=$run_id pr=#$pr_number conclusion=$conclusion head=$head_sha bound_base=${external_id:-<none>}"
          }

          # Fail-closed marker for a sweep past MAX_BASE_SWEEP_PRS: an
          # omitted PR must not keep its pre-push verdict standing (the push
          # staled its exact-oid binding), so it gets an explicit red rather
          # than silence. Its next PR-scoped event re-evaluates it fully.
          # Same pending-first discipline as evaluate_pr, and the same
          # publish-time revalidation: if the PR closed, its head moved, or
          # it was retargeted off the pushed branch while the sweep ran,
          # that change fired a PR-scoped event whose run owns the verdict —
          # posting a stale overflow failure here could bury that run's
          # correct success until the next event.
          publish_sweep_overflow() {
            local pr_number="$1" head_sha="$2" pushed_ref="$3" run_id
            run_id="$(gh api -X POST "repos/$REPO/check-runs" \
              -f name=review-binding \
              -f head_sha="$head_sha" \
              -f status=in_progress \
              -f "output[title]=Evaluating review binding (sweep overflow)" \
              -f "output[summary]=Base branch \`$pushed_ref\` advanced; PR #$pr_number fell past the sweep cap and is being failed closed." \
              --jq '.id')"
            local live_json live_state live_head live_base_ref
            live_json="$(gh api "repos/$REPO/pulls/$pr_number")"
            live_state="$(jq -r '.state // ""' <<<"$live_json")"
            live_head="$(jq -r '.head.sha // ""' <<<"$live_json")"
            live_base_ref="$(jq -r '.base.ref // ""' <<<"$live_json")"
            if [ "$live_state" != "open" ] || [ "$live_head" != "$head_sha" ] || [ "$live_base_ref" != "$pushed_ref" ]; then
              echo "PR #$pr_number moved during the sweep (now state=$live_state head=$live_head base_ref=$live_base_ref; listed head=$head_sha base_ref=$pushed_ref); completing run $run_id as cancelled — the event fired by that move owns the verdict."
              gh api -X PATCH "repos/$REPO/check-runs/$run_id" \
                -f status=completed \
                -f conclusion=cancelled \
                -f "output[title]=Superseded during sweep" \
                -f "output[summary]=PR #$pr_number's coordinates moved while the base-push sweep ran (now state=$live_state head=\`$live_head\` base ref=\`$live_base_ref\`; listed head=\`$head_sha\` base ref=\`$pushed_ref\`). The event fired by that move owns the fresh verdict; this run publishes none." \
                >/dev/null
              return 0
            fi
            gh api -X PATCH "repos/$REPO/check-runs/$run_id" \
              -f status=completed \
              -f conclusion=failure \
              -f "output[title]=Base advanced; not re-evaluated (sweep cap)" \
              -f "output[summary]=The base branch this PR targets advanced, which stales its exact-oid base binding, but more than $MAX_BASE_SWEEP_PRS open PRs target the pushed branch and this PR fell past the cap. Failing closed instead of leaving the pre-push verdict standing. Any event on this PR (a comment, a review, a head push, a base edit) re-evaluates it fully." \
              >/dev/null
            echo "Published fail-closed overflow check-run id=$run_id pr=#$pr_number head=$head_sha (past MAX_BASE_SWEEP_PRS=$MAX_BASE_SWEEP_PRS)"
          }

          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            # A base-branch push silently stales the bindings of every open
            # PR targeting it; none of the PR-scoped events fire, so fan out.
            # The ref travels as a URL-encoded query parameter (gh api -f on
            # a GET): git permits '&' and '#' in branch names, and raw
            # interpolation would corrupt the query.
            pushed_ref="${GITHUB_REF_NAME:?}"
            pr_rows="$(gh api --paginate -X GET "repos/$REPO/pulls" \
              -f state=open -f base="$pushed_ref" -F per_page=100 \
              --jq '.[] | [(.number | tostring), (.head.sha // "")] | @tsv')"
            total_open="$(printf '%s\n' "$pr_rows" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$total_open" -eq 0 ]; then
              echo "No open PRs target '$pushed_ref'; nothing to evaluate."
            else
              if [ "$total_open" -gt "$MAX_BASE_SWEEP_PRS" ]; then
                echo "WARNING: $total_open open PRs target '$pushed_ref'; fully re-evaluating the first $MAX_BASE_SWEEP_PRS and failing the rest closed." >&2
              fi
              seen=0
              sweep_failures=0
              while IFS=$'\t' read -r pr sweep_head; do
                [ -n "$pr" ] || continue
                seen=$((seen + 1))
                if [ "$seen" -le "$MAX_BASE_SWEEP_PRS" ]; then
                  # Isolated: one PR's API failure must not strand the REST of
                  # the sweep with stale verdicts under set -e — and the
                  # isolation must not itself suppress errexit inside the
                  # evaluation (PR #753 review, rounds 5 and 6). The failed
                  # entry's own run stays visibly non-green, the failure is
                  # annotated, and later heads still get their re-evaluation.
                  run_isolated evaluate_pr "$pr" "$sweep_head"
                  if [ "$ISOLATED_RC" -ne 0 ]; then
                    echo "::error::sweep evaluation failed for PR #$pr; its check-run is not green and the sweep continued"
                    sweep_failures=$((sweep_failures + 1))
                  fi
                else
                  # The overflow publisher is fallible API too: unwrapped, one
                  # failure strands every LATER overflow head with its stale
                  # success (PR #753 review, round 6).
                  run_isolated publish_sweep_overflow "$pr" "$sweep_head" "$pushed_ref"
                  if [ "$ISOLATED_RC" -ne 0 ]; then
                    echo "::error::overflow invalidation failed for PR #$pr; continuing with the rest"
                    sweep_failures=$((sweep_failures + 1))
                  fi
                fi
              done <<<"$pr_rows"
              if [ "${sweep_failures:-0}" -gt 0 ]; then
                echo "::error::$sweep_failures sweep evaluation(s) failed; failing the sweep run itself"
                exit 1
              fi
            fi
          elif [ "${GITHUB_EVENT_NAME:-}" = "status" ]; then
            # A review-request status write changes this check's inputs on an
            # unchanged head while firing no PR-scoped event (see the trigger
            # rationale above). The job-level if already filtered to the two
            # review-request contexts; re-check here so the filter survives a
            # future if: edit (defense in depth, not a second policy).
            case "${STATUS_CONTEXT:-}" in
              "$INTENT_STATUS_CONTEXT" | "$COMPLETE_STATUS_CONTEXT") ;;
              *)
                echo "Status context '${STATUS_CONTEXT:-<none>}' is not review-request evidence; nothing to evaluate."
                exit 0
                ;;
            esac
            status_sha="${STATUS_SHA:?}"
            # Re-evaluate every open PR whose head IS this commit. Naturally
            # bounded: two or more PRs sharing the head fail closed under the
            # shared-head guard, so the fan-out stays tiny by construction.
            status_prs="$(gh api --paginate "repos/$REPO/commits/$status_sha/pulls?per_page=100" \
              --jq ".[] | select(.state == \"open\" and .head.sha == \"$status_sha\") | .number" \
              | sort -un)"
            if [ -z "$status_prs" ]; then
              echo "No open PR has head $status_sha; nothing to evaluate."
            else
              status_failures=0
              while read -r pr; do
                [ -n "$pr" ] || continue
                run_isolated evaluate_pr "$pr" "$status_sha"
                if [ "$ISOLATED_RC" -ne 0 ]; then
                  echo "::error::status-event evaluation failed for PR #$pr; continuing with the rest"
                  status_failures=$((status_failures + 1))
                fi
              done <<<"$status_prs"
              if [ "${status_failures:-0}" -gt 0 ]; then
                exit 1
              fi
            fi
          else
            # With this, every event family either passes its known SHA
            # (sweep: sweep_head; status: status_sha; pull_request*: the
            # payload head) or provably has none (issue comments). The
            # known-SHA enumeration is closed by construction.
            evaluate_pr "$PR_NUMBER" "${PR_EVENT_HEAD_SHA:-}"
          fi
