name: review-binding

# Publishes exactly one manually-created `review-binding` check on the current
# PR head. The job's own Actions check has a different name so it cannot race
# the verdict branch protection reads. No PR code is checked out or executed:
# the pure evaluator is downloaded from the PR's current base commit.

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to rebuild
        required: true
        type: number
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  status:
  push:

permissions:
  checks: write
  contents: read
  pull-requests: read
  issues: read
  statuses: write

defaults:
  run:
    shell: bash

concurrency:
  group: review-binding-${{ github.event.pull_request.number || github.event.issue.number || github.event.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: evaluate review evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_PR: ${{ inputs.pull_request }}
      TRUSTED_REVIEWERS: chatgpt-codex-connector,chatgpt-codex-connector[bot]
      # The workflow and evaluator arrive together in the PR based on this
      # commit, so that one non-required observation run cannot load its base
      # evaluator. Delete this inert one-commit shim in the ruleset PR, before
      # review-binding becomes required.
      BOOTSTRAP_BASE_SHA: 89a09eae59817f71b975486436e86d673b7e0353
    steps:
      - name: Rebuild review-binding verdict
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          api_array() {
            local endpoint="$1" output="$2"
            gh api --paginate "$endpoint" | jq -s 'add // []' >"$output"
          }

          publish_check() {
            local run_id="$1" conclusion="$2" title="$3" summary="$4"
            gh api -X PATCH "repos/$REPO/check-runs/$run_id" \
              -f status=completed \
              -f conclusion="$conclusion" \
              -f "output[title]=$title" \
              -f "output[summary]=${summary:0:60000}" >/dev/null
          }

          publish_api_failure() {
            local run_id="$1" detail="$2"
            publish_check "$run_id" failure "Review evidence could not be read" \
              "The check failed closed because GitHub evidence collection was incomplete: $detail"
          }

          establish_request_marker() {
            [ "$EVENT_NAME" = issue_comment ] || return 0
            [ "$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")" = created ] || return 0
            jq -e '(.comment.author_association // "") as $association |
              (.issue.pull_request != null) and
              ((.comment.body // "") | test("^[[:space:]]*@codex[[:space:]]+review([[:space:]]|$)"; "i")) and
              (["OWNER", "MEMBER", "COLLABORATOR"] | index($association))' \
              "$GITHUB_EVENT_PATH" >/dev/null || return 0

            local number head base base_ref comment description target
            number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
            comment="$(jq -r '.comment.id' "$GITHUB_EVENT_PATH")"
            target="$(jq -r '.comment.html_url' "$GITHUB_EVENT_PATH")"
            gh api "repos/$REPO/pulls/$number" >"$tmp_dir/request-pr.json"
            head="$(jq -r '.head.sha' "$tmp_dir/request-pr.json")"
            base="$(jq -r '.base.sha' "$tmp_dir/request-pr.json")"
            base_ref="$(jq -r '.base.ref' "$tmp_dir/request-pr.json")"
            description="v1 pr=$number ref=$base_ref base=$base comment=$comment"
            gh api -X POST "repos/$REPO/statuses/$head" \
              -f state=success \
              -f context=touchstone/review-request-v1 \
              -f description="$description" \
              -f target_url="$target" >/dev/null
          }

          evaluate_pr() {
            local number="$1"
            local pr_file="$tmp_dir/pr-$number.json"
            local head base run_id evaluator evidence verdict conclusion title summary

            if ! gh api "repos/$REPO/pulls/$number" >"$pr_file"; then
              echo "Could not read PR #$number" >&2
              return 1
            fi
            [ "$(jq -r '.state' "$pr_file")" = open ] || return 0
            head="$(jq -r '.head.sha' "$pr_file")"
            base="$(jq -r '.base.sha' "$pr_file")"
            if [ "$base" = "$BOOTSTRAP_BASE_SHA" ]; then
              echo "PR #$number is the one-commit bootstrap; review-binding is not required yet."
              return 0
            fi

            run_id="$(gh api -X POST "repos/$REPO/check-runs" \
              -f name=review-binding \
              -f head_sha="$head" \
              -f status=in_progress \
              -f "output[title]=Reading authoritative review evidence" \
              -f "output[summary]=PR #$number at head \`$head\` and base \`$base\`." \
              --jq .id)"

            if ! api_array "repos/$REPO/commits/$head/statuses?per_page=100" "$tmp_dir/statuses-$number.json" \
              || ! api_array "repos/$REPO/issues/$number/comments?per_page=100" "$tmp_dir/issues-$number.json" \
              || ! api_array "repos/$REPO/pulls/$number/reviews?per_page=100" "$tmp_dir/reviews-$number.json" \
              || ! api_array "repos/$REPO/pulls/$number/comments?per_page=100" "$tmp_dir/review-comments-$number.json" \
              || ! api_array "repos/$REPO/commits/$head/pulls?per_page=100" "$tmp_dir/head-pulls-$number.json"; then
              publish_api_failure "$run_id" "a paginated REST request failed"
              return 1
            fi

            # GraphQL variables must remain literal for gh to bind them.
            # shellcheck disable=SC2016
            if ! gh api graphql \
              -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$number" \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision}}}' \
              --jq '{decision: (.data.repository.pullRequest.reviewDecision // "")}' \
              >"$tmp_dir/graphql-$number.json"; then
              publish_api_failure "$run_id" "the authoritative review decision request failed"
              return 1
            fi

            evaluator="$tmp_dir/evaluate-$number.jq"
            if ! gh api "repos/$REPO/contents/.github/review-binding/evaluate.jq?ref=$base" --jq .content \
              | base64 --decode >"$evaluator"; then
              publish_api_failure "$run_id" "the versioned evaluator could not be loaded from base $base"
              return 1
            fi

            evidence="$tmp_dir/evidence-$number.json"
            jq -n \
              --slurpfile pr "$pr_file" \
              --slurpfile statuses "$tmp_dir/statuses-$number.json" \
              --slurpfile issueComments "$tmp_dir/issues-$number.json" \
              --slurpfile reviews "$tmp_dir/reviews-$number.json" \
              --slurpfile reviewComments "$tmp_dir/review-comments-$number.json" \
              --slurpfile headPulls "$tmp_dir/head-pulls-$number.json" \
              --slurpfile graph "$tmp_dir/graphql-$number.json" \
              --arg trusted "$TRUSTED_REVIEWERS" \
              --arg repo "$REPO" \
              '($pr[0]) as $pr |
              ($statuses[0]) as $statuses |
              ($issueComments[0]) as $issueComments |
              ($reviews[0]) as $reviews |
              ($reviewComments[0]) as $reviewComments |
              ($headPulls[0]) as $headPulls |
              ($graph[0]) as $graph |
              {
                contractVersion: 1,
                complete: true,
                trustedAuthors: ($trusted | split(",")),
                pr: {
                  number: $pr.number,
                  state: $pr.state,
                  headSha: $pr.head.sha,
                  baseRef: $pr.base.ref,
                  baseSha: $pr.base.sha,
                  reviewDecision: $graph.decision,
                  openHeadPulls: [$headPulls[] | select(.state == "open" and .base.repo.full_name == $repo) | .number]
                },
                statuses: $statuses,
                issueComments: $issueComments,
                reviews: $reviews,
                reviewComments: $reviewComments
              }' >"$evidence"

            if ! verdict="$(jq -f "$evaluator" "$evidence")"; then
              publish_api_failure "$run_id" "the versioned evaluator rejected the evidence document"
              return 1
            fi
            conclusion="$(jq -r .conclusion <<<"$verdict")"
            title="$(jq -r .title <<<"$verdict")"
            summary="$(jq -r .summary <<<"$verdict")"

            if ! gh api "repos/$REPO/pulls/$number" >"$tmp_dir/live-pr-$number.json"; then
              publish_api_failure "$run_id" "the live PR coordinates could not be revalidated before publication"
              return 1
            fi
            live_head="$(jq -r .head.sha "$tmp_dir/live-pr-$number.json")"
            live_base="$(jq -r .base.sha "$tmp_dir/live-pr-$number.json")"
            if [ "$live_head" != "$head" ] || [ "$live_base" != "$base" ]; then
              publish_check "$run_id" cancelled "PR coordinates changed during evaluation" \
                "Evaluated head/base: \`$head\` / \`$base\`. Live head/base: \`$live_head\` / \`$live_base\`. The coordinate-change event owns the new verdict."
              return 0
            fi

            if ! newest_run="$(gh api "repos/$REPO/commits/$head/check-runs?check_name=review-binding&per_page=100" \
              --jq '[.check_runs[].id] | max // 0')"; then
              publish_api_failure "$run_id" "newer review-binding runs could not be inspected before publication"
              return 1
            fi
            if [ "$newest_run" != "$run_id" ]; then
              publish_check "$run_id" cancelled "A newer review-binding run owns this head" \
                "Run $run_id did not publish its potentially stale verdict because check run $newest_run was created later for \`$head\`."
              return 0
            fi
            publish_check "$run_id" "$conclusion" "$title" "$summary"
          }

          establish_request_marker

          numbers=""
          case "$EVENT_NAME" in
            workflow_dispatch)
              numbers="$DISPATCH_PR"
              ;;
            pull_request)
              if [ "$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")" = closed ]; then
                event_head="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
                numbers="$(gh api --paginate "repos/$REPO/commits/$event_head/pulls?per_page=100" --jq '.[] | select(.state == "open") | .number')"
              else
                numbers="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              fi
              ;;
            pull_request_review | pull_request_review_comment)
              numbers="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              ;;
            issue_comment)
              jq -e '.issue.pull_request != null' "$GITHUB_EVENT_PATH" >/dev/null || exit 0
              numbers="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              ;;
            status)
              [ "$(jq -r '.context // ""' "$GITHUB_EVENT_PATH")" = touchstone/review-request-v1 ] || exit 0
              status_sha="$(jq -r '.sha' "$GITHUB_EVENT_PATH")"
              numbers="$(gh api --paginate "repos/$REPO/commits/$status_sha/pulls?per_page=100" --jq '.[] | select(.state == "open") | .number')"
              ;;
            push)
              pushed_ref="${GITHUB_REF#refs/heads/}"
              numbers="$(gh api --paginate --method GET "repos/$REPO/pulls" \
                -f state=open -f "base=$pushed_ref" -f per_page=100 \
                --jq '.[].number')"
              ;;
            *) exit 0 ;;
          esac

          failures=0
          for number in $numbers; do
            if ! evaluate_pr "$number"; then
              failures=$((failures + 1))
            fi
          done
          [ "$failures" -eq 0 ]
