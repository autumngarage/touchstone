# review-binding — was THIS artifact reviewed?
#
# Publishes a check-run named "review-binding" on the PR's current head SHA.
# The check answers exactly one question: does trusted-author review evidence
# exist for the EXACT current head, bound to the EXACT current base? (#726.)
#
#   GREEN = trusted review evidence exists for the PR's current head (a formal
#           review whose commit oid equals the head, or the reviewer's result
#           comment naming the head — the same two channels the local merge
#           gate accepts), AND the review-request base binding recorded on
#           that head matches the PR's current base oid, AND the evidence
#           strictly postdates the request that bound that base (same-second
#           ties fail closed — second precision cannot prove ordering, the
#           same rule merge-pr.sh applies). Findings may exist
#           and be severe — the check is still green. This check never means
#           "approved" (trap 6, decision 2 on #744): the reviewer has emitted
#           zero APPROVED verdicts in 96 reviews, so gating on approval would
#           brick the repo. Required approvals stay zero; unresolved findings
#           are enforced by required conversation resolution, a separate gate.
#   RED   = no trusted review evidence at this head, or the base binding is
#           absent/conflicting or no longer matches the PR's current base, or
#           the only evidence is from an untrusted author, or no evidence
#           strictly postdates the request that bound the current base. The
#           output summary says which.
#
# Idempotent per head+base (issue #751): the conclusion is a pure function of
# (head oid, base oid, evidence at that head), and it is monotone — new events
# can only add evidence, never remove it, so a green verdict cannot flip red
# while head and base stand still. The freshness bound is the EARLIEST
# successful request intent binding the current base, deliberately not the
# latest: measuring against the latest would let a re-request flip green back
# to red on a byte-identical head, the exact non-termination #751 measured.
# Re-requesting can never raise the earliest-intent bar, and re-reviewing only
# adds evidence at the same oid.
#
# Evidence sources (mirrors scripts/merge-pr.sh):
#   - formal reviews: GET /repos/{o}/{r}/pulls/{n}/reviews where commit_id ==
#     current head and user.login is on the trusted allowlist below;
#   - result comments: trusted-author issue comments carrying
#     "Reviewed commit:" plus the backticked short head, resolved through the
#     commits API to the exact current head — the same comment channel
#     merge-pr.sh accepts in latest_trusted_pr_comment_result, and
#     verdict-agnostic here because this check binds artifacts, not verdicts;
#   - base binding: the "touchstone/review-request-intent" commit status that
#     scripts/open-pr.sh posts on the head, whose description carries
#     "pr=<n> base=<oid>"; that oid is compared to the PR's current base oid,
#     and its created_at anchors the freshness bound above. Commit statuses
#     require push access, so this surface is not internet-writable; reviews
#     and comments on a public repo ARE, which is why the author allowlist is
#     hardcoded in this file's env and never read from PR-controlled files.
#   Exact-oid base semantics are inherited from the local merge gate; #734 may
#   relax this to an ancestry check later.
#
# Triggers, and why each exists:
#   - pull_request_review (submitted, dismissed): a formal review submission
#     is delivered through this event, not issue_comment — without it a
#     finding-bearing review that posts no separate comment would never
#     re-evaluate, leaving a required check red forever. Dismissal changes
#     the evidence surface too, so it re-evaluates as well.
#   - issue_comment (created), filtered to PR comments: the reviewer's result
#     comment channel, and the "@codex review" request itself.
#   - pull_request (synchronize, reopened, edited): synchronize makes every
#     new head start red; edited catches base retargeting.
#   - push (branches): when a base branch advances, the bindings of every open
#     PR targeting it go stale under exact-oid semantics while none of the
#     PR-scoped events fire — so a push re-evaluates every open PR whose base
#     ref is the pushed branch (capped at MAX_BASE_SWEEP_PRS so one push can
#     never become an unbounded API storm). This re-evaluation is what keeps
#     the exact-OID base binding honest between head pushes. Push runs execute
#     the pushed branch's copy of this file, a surface writable only by
#     collaborators.
#
# Trap 7 (see the header of validate.yml): this workflow executes no
# PR-controlled code — there is no checkout of PR code AT ALL, no third-party
# actions, nothing derived from PR file contents. It only calls the GitHub API
# from this definition. The remaining caveat before making this check
# *required*: a pull_request event runs the PR's copy of this file, so the
# required-run pinning tracked in #727 applies to this check the same as to
# validate.
#
# Fork PRs: GITHUB_TOKEN is read-only there, so the check-run POST fails and
# the job errors WITHOUT publishing a verdict — inspection failure is never
# collapsed into a red (or green) conclusion.
#
# Re-runs on the same head POST a fresh check-run of the same name; branch
# protection and the PR UI read the newest run of that name, so runs update
# rather than stack.

name: review-binding

on:
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize, reopened, edited]
  push:
    branches: ['**']

permissions:
  checks: write
  pull-requests: read
  statuses: read
  contents: read

# A newer evaluation for the same PR (or same pushed ref) supersedes an
# in-flight one. Safe to cancel: every run re-reads live PR state, and the
# verdict is idempotent per head+base, so the surviving run publishes the
# same conclusion the cancelled one would have.
concurrency:
  group: review-binding-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Deliberately NOT named "review-binding": the job's own check-run is named
  # after the job, and a job named review-binding would go green on every
  # successful run — even one that just published a FAILURE verdict — leaving
  # two same-named check-runs racing for what branch protection reads. The
  # only check-run named "review-binding" is the one this job POSTs.
  evaluate:
    name: evaluate
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'push' ||
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      # Trusted review authors, hardcoded here on purpose: the review/comment
      # surface of a public repo is internet-writable, so the allowlist must
      # live in the workflow definition, never in PR-controlled files.
      TRUSTED_REVIEW_AUTHORS: "chatgpt-codex-connector,chatgpt-codex-connector[bot]"
      INTENT_STATUS_CONTEXT: touchstone/review-request-intent
      # Upper bound on how many open PRs one base push re-evaluates. The
      # observed open-PR count here is single-digit; 50 is an order of
      # magnitude of headroom, and the cap exists so a pathological PR
      # pileup cannot turn one push into an unbounded API storm.
      MAX_BASE_SWEEP_PRS: "50"
    steps:
      - name: Evaluate binding and publish the check-run
        run: |
          set -euo pipefail

          author_is_trusted() {
            local candidate="$1" item
            local -a items
            IFS=',' read -r -a items <<<"$TRUSTED_REVIEW_AUTHORS"
            for item in "${items[@]}"; do
              if [ "$item" = "$candidate" ]; then
                return 0
              fi
            done
            return 1
          }

          # Appends to the caller's local 'reasons' via dynamic scoping.
          add_reason() {
            reasons="${reasons}${reasons:+$'\n'}- $1"
          }

          evaluate_pr() {
            local pr_number="$1"
            # Live PR coordinates, not the event payload: comment events carry
            # no head SHA, and idempotence means evaluating the PR as it is
            # now. Any API failure below exits nonzero BEFORE the POST, so
            # "could not inspect" fails the job instead of publishing a
            # definite verdict.
            local pr_json pr_state head_sha base_oid base_ref
            pr_json="$(gh api "repos/$REPO/pulls/$pr_number")"
            pr_state="$(jq -r '.state // ""' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
            base_oid="$(jq -r '.base.sha // ""' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref // ""' <<<"$pr_json")"
            if [ -z "$head_sha" ] || [ -z "$base_oid" ]; then
              echo "ERROR: incomplete PR #$pr_number coordinates (head='$head_sha' base='$base_oid'); not publishing." >&2
              return 1
            fi
            if [ "$pr_state" != "open" ]; then
              echo "PR #$pr_number is $pr_state; out of scope for the merge gate. Publishing nothing."
              return 0
            fi

            # Base binding recorded on the head by scripts/open-pr.sh. The
            # earliest intent binding the CURRENT base anchors freshness:
            # evidence older than the first request for this base may have
            # reviewed a different diff (a spontaneous review of the same
            # head against an earlier base carries no base identity).
            local statuses_tsv bound_bases earliest_matching_intent_at
            local context status_state created_at description request_pr request_base
            statuses_tsv="$(gh api --paginate "repos/$REPO/commits/$head_sha/statuses?per_page=100" \
              --jq '.[] | [(.context // ""), (.state // ""), (.created_at // ""), ((.description // "") | gsub("[\r\n\t]"; " "))] | @tsv')"
            bound_bases=""
            earliest_matching_intent_at=""
            while IFS=$'\t' read -r context status_state created_at description || [ -n "$context" ]; do
              [ "$context" = "$INTENT_STATUS_CONTEXT" ] || continue
              [ "$status_state" = "success" ] || continue
              case "$description" in
                pr=*' base='*) ;;
                *) continue ;;
              esac
              request_pr="${description#pr=}"
              request_pr="${request_pr%% base=*}"
              request_base="${description#* base=}"
              [ "$request_pr" = "$pr_number" ] || continue
              case ",$bound_bases," in
                *",$request_base,"*) ;;
                *) bound_bases="${bound_bases}${bound_bases:+,}$request_base" ;;
              esac
              if [ "$request_base" = "$base_oid" ] && [ -n "$created_at" ]; then
                if [ -z "$earliest_matching_intent_at" ] || [[ "$created_at" < "$earliest_matching_intent_at" ]]; then
                  earliest_matching_intent_at="$created_at"
                fi
              fi
            done <<<"$statuses_tsv"

            local reasons="" binding_ok=false threshold=""
            if [ -z "$bound_bases" ]; then
              add_reason "no base binding: no successful \`$INTENT_STATUS_CONTEXT\` status on head \`$head_sha\` records \`pr=$pr_number base=<oid>\`"
            elif [ "${bound_bases#*,}" != "$bound_bases" ]; then
              add_reason "conflicting base bindings on head \`$head_sha\`: \`$bound_bases\` (current base \`$base_ref\` is at \`$base_oid\`)"
            elif [ "$bound_bases" != "$base_oid" ]; then
              add_reason "base binding mismatch: review was requested against base \`$bound_bases\`, but PR #$pr_number now targets \`$base_ref\` at \`$base_oid\`"
            else
              binding_ok=true
              threshold="$earliest_matching_intent_at"
            fi

            # Trusted review evidence bound to the exact current head.
            # Channel 1: formal reviews whose commit oid equals the head.
            local evidence="" untrusted_reviews=0
            local reviews_tsv author commit_oid review_state submitted_at
            reviews_tsv="$(gh api --paginate "repos/$REPO/pulls/$pr_number/reviews?per_page=100" \
              --jq '.[] | [(.user.login // ""), (.commit_id // ""), (.state // ""), (.submitted_at // "")] | @tsv')"
            while IFS=$'\t' read -r author commit_oid review_state submitted_at || [ -n "$author" ]; do
              [ -n "$author" ] || continue
              [ "$commit_oid" = "$head_sha" ] || continue
              if author_is_trusted "$author"; then
                [ -n "$submitted_at" ] || continue
                evidence="${evidence}${evidence:+$'\n'}$submitted_at"$'\t'"formal review by @$author ($review_state) at $submitted_at"
              else
                untrusted_reviews=$((untrusted_reviews + 1))
              fi
            done <<<"$reviews_tsv"

            # Channel 2: the reviewer's result comment naming the exact head
            # (same surface merge-pr.sh accepts). Verdict-agnostic: clean or
            # finding-bearing, the artifact was reviewed either way. The
            # short oid is resolved through the commits API and must equal
            # the full current head.
            local comments_tsv head_short comment_head_resolved=false resolved_commit="" body
            head_short="$(printf '%.10s' "$head_sha")"
            comments_tsv="$(gh api --paginate "repos/$REPO/issues/$pr_number/comments?per_page=100" \
              --jq '.[] | [(.user.login // ""), (.created_at // ""), ((.body // "") | gsub("[\r\n\t]"; " "))] | @tsv')"
            while IFS=$'\t' read -r author created_at body || [ -n "$author" ]; do
              [ -n "$author" ] || continue
              author_is_trusted "$author" || continue
              [ -n "$created_at" ] || continue
              case "$body" in
                *"Reviewed commit:"*"\`$head_short\`"*) ;;
                *) continue ;;
              esac
              if [ "$comment_head_resolved" = false ]; then
                resolved_commit="$(gh api "repos/$REPO/commits/$head_short" --jq '.sha')"
                comment_head_resolved=true
              fi
              [ "$resolved_commit" = "$head_sha" ] || continue
              evidence="${evidence}${evidence:+$'\n'}$created_at"$'\t'"result comment by @$author at $created_at"
            done <<<"$comments_tsv"

            # Count evidence; when the binding is valid, only evidence
            # STRICTLY after the earliest matching request counts. Same-second
            # ties fail closed: GitHub timestamps have second precision, and
            # "same second" cannot prove the evidence followed the request —
            # the same rule merge-pr.sh applies.
            local total_evidence=0 qualifying=0 latest_ts="" latest_detail="" ts detail
            while IFS=$'\t' read -r ts detail || [ -n "$ts" ]; do
              [ -n "$ts" ] || continue
              total_evidence=$((total_evidence + 1))
              if [ "$binding_ok" = true ] && [ -n "$threshold" ] && ! [[ "$ts" > "$threshold" ]]; then
                continue
              fi
              qualifying=$((qualifying + 1))
              if [ -z "$latest_ts" ] || [[ "$ts" > "$latest_ts" ]]; then
                latest_ts="$ts"
                latest_detail="$detail"
              fi
            done <<<"$evidence"

            if [ "$total_evidence" -eq 0 ]; then
              if [ "$untrusted_reviews" -gt 0 ]; then
                add_reason "the only review evidence at head \`$head_sha\` is from untrusted author(s) ($untrusted_reviews review(s) not on the allowlist: $TRUSTED_REVIEW_AUTHORS)"
              else
                add_reason "no trusted-author review evidence (formal review or result comment) exists for head \`$head_sha\`"
              fi
            elif [ "$binding_ok" = true ] && [ "$qualifying" -eq 0 ]; then
              add_reason "no trusted review evidence at head \`$head_sha\` strictly postdates the request that bound base \`$base_oid\` (earliest matching request: $threshold; same-second ties fail closed), so it may have reviewed a different diff"
            fi

            local external_id=""
            case "$bound_bases" in
              *,*) : ;;
              ?*) external_id="$bound_bases" ;;
            esac

            local coords footer conclusion title summary
            coords=$'\n'"- head: \`$head_sha\`"$'\n'"- current base: \`$base_ref\` @ \`$base_oid\`"
            footer=$'\n\n'"This check answers \"was this exact artifact reviewed\", never \"was it approved\"; unresolved findings are enforced by required conversation resolution, not here (#726)."
            if [ -z "$reasons" ]; then
              conclusion="success"
              title="Reviewed at this head, bound to the current base"
              summary="Trusted review evidence exists for the exact current head, strictly after the request that bound the PR's current base.$coords"$'\n'"- evidence: $latest_detail (qualifying evidence at this head: $qualifying)"$'\n'"- request bound this base at: $threshold$footer"
            else
              conclusion="failure"
              title="Not reviewed at this head+base"
              summary="This head+base pair has no binding trusted-review evidence:"$'\n\n'"$reasons"$'\n'"$coords"$'\n\n'"To turn this green, request a trusted review for this exact head (bash scripts/open-pr.sh) and let it complete.$footer"
            fi

            local run_id
            run_id="$(gh api -X POST "repos/$REPO/check-runs" \
              -f name=review-binding \
              -f head_sha="$head_sha" \
              -f status=completed \
              -f conclusion="$conclusion" \
              -f external_id="$external_id" \
              -f "output[title]=$title" \
              -f "output[summary]=$summary" \
              --jq '.id')"
            echo "Published check-run review-binding id=$run_id pr=#$pr_number conclusion=$conclusion head=$head_sha bound_base=${external_id:-<none>}"
          }

          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            # A base-branch push silently stales the bindings of every open
            # PR targeting it; none of the PR-scoped events fire, so fan out.
            pushed_ref="${GITHUB_REF_NAME:?}"
            pr_list="$(gh api --paginate "repos/$REPO/pulls?state=open&base=$pushed_ref&per_page=100" --jq '.[].number')"
            total_open="$(printf '%s\n' "$pr_list" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$total_open" -gt "$MAX_BASE_SWEEP_PRS" ]; then
              echo "WARNING: $total_open open PRs target '$pushed_ref'; re-evaluating only the first $MAX_BASE_SWEEP_PRS." >&2
              pr_list="$(head -n "$MAX_BASE_SWEEP_PRS" <<<"$pr_list")"
            fi
            if [ -z "$pr_list" ]; then
              echo "No open PRs target '$pushed_ref'; nothing to evaluate."
            else
              while IFS= read -r pr; do
                [ -n "$pr" ] || continue
                evaluate_pr "$pr"
              done <<<"$pr_list"
            fi
          else
            evaluate_pr "$PR_NUMBER"
          fi
