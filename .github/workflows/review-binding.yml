# review-binding — was THIS artifact reviewed?
#
# Publishes a check-run named "review-binding" on the PR's current head SHA.
# The check answers exactly one question: does a trusted-author review exist
# for the EXACT current head, bound to the EXACT current base? (Issue #726.)
#
#   GREEN = a formal review by a trusted author exists whose commit oid equals
#           the PR's current head, AND the review-request base binding recorded
#           on that head matches the PR's current base oid. Findings may exist
#           and be severe — the check is still green. This check never means
#           "approved" (trap 6, decision 2 on #744): the reviewer has emitted
#           zero APPROVED verdicts in 96 reviews, so gating on approval would
#           brick the repo. Required approvals stay zero; unresolved findings
#           are enforced by required conversation resolution, a separate gate.
#   RED   = no trusted review at this head, or the base binding no longer
#           matches the PR's current base, or the only review evidence at this
#           head is from an untrusted author. The output summary says which.
#
# Idempotent per head+base (issue #751): the conclusion is a pure function of
# (head oid, base oid, review evidence at that head). Re-reviewing an unchanged
# head can only add more trusted reviews at the same oid, which cannot flip the
# conclusion. Deliberately NO timestamp ordering between request and review:
# requiring "review postdates the latest request" would let a re-request flip
# green back to red on a byte-identical head — the exact non-termination #751
# measured. Freshness is subsumed by exact-oid head binding: a formal review
# whose commit oid equals the head is intrinsically a review of this artifact.
#
# Evidence sources (mirrors scripts/merge-pr.sh):
#   - formal reviews: GET /repos/{o}/{r}/pulls/{n}/reviews where commit_id ==
#     current head and user.login is on the trusted allowlist below;
#   - base binding: the "touchstone/review-request-intent" commit status that
#     scripts/open-pr.sh posts on the head, whose description carries
#     "pr=<n> base=<oid>"; that oid is compared to the PR's current base oid.
#     Commit statuses require push access, so this surface is not
#     internet-writable; reviews and comments on a public repo ARE, which is
#     why the author allowlist is hardcoded in this file's env and never read
#     from PR-controlled files.
#   Exact-oid base semantics are inherited from the local merge gate; #734 may
#   relax this to "reviewed base is an ancestor of / equal to current base".
#
# Trap 7 (see the header of validate.yml): this workflow executes no
# PR-controlled code — there is no checkout of PR code AT ALL, no third-party
# actions, nothing derived from PR file contents. It only calls the GitHub API
# from this definition. The remaining caveat before making this check
# *required*: a pull_request event runs the PR's copy of this file, so the
# required-run pinning tracked in #727 applies to this check the same as to
# validate.
#
# Fork PRs: GITHUB_TOKEN is read-only there, so the check-run POST fails and
# the job errors WITHOUT publishing a verdict — inspection failure is never
# collapsed into a red (or green) conclusion.
#
# Re-runs on the same head POST a fresh check-run of the same name; branch
# protection and the PR UI read the newest run of that name, so runs update
# rather than stack.

name: review-binding

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize, reopened, edited]

permissions:
  checks: write
  pull-requests: read
  statuses: read
  contents: read

# A newer evaluation for the same PR supersedes an in-flight one. Safe to
# cancel: every run re-reads live PR state, and the verdict is idempotent
# per head+base, so the surviving run publishes the same conclusion the
# cancelled one would have.
concurrency:
  group: review-binding-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Deliberately NOT named "review-binding": the job's own check-run is named
  # after the job, and a job named review-binding would go green on every
  # successful run — even one that just published a FAILURE verdict — leaving
  # two same-named check-runs racing for what branch protection reads. The
  # only check-run named "review-binding" is the one this job POSTs.
  evaluate:
    name: evaluate
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      # Trusted review authors, hardcoded here on purpose: the review/comment
      # surface of a public repo is internet-writable, so the allowlist must
      # live in the workflow definition, never in PR-controlled files.
      TRUSTED_REVIEW_AUTHORS: "chatgpt-codex-connector,chatgpt-codex-connector[bot]"
      INTENT_STATUS_CONTEXT: touchstone/review-request-intent
    steps:
      - name: Evaluate binding and publish the check-run
        run: |
          set -euo pipefail

          # Live PR coordinates, not the event payload: issue_comment carries
          # no head SHA, and idempotence means evaluating the PR as it is now.
          # Any API failure below exits nonzero BEFORE the POST, so "could not
          # inspect" fails the job instead of publishing a definite verdict.
          pr_json="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          pr_state="$(jq -r '.state // ""' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
          base_oid="$(jq -r '.base.sha // ""' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref // ""' <<<"$pr_json")"
          if [ -z "$head_sha" ] || [ -z "$base_oid" ]; then
            echo "ERROR: incomplete PR coordinates (head='$head_sha' base='$base_oid'); not publishing." >&2
            exit 1
          fi
          if [ "$pr_state" != "open" ]; then
            echo "PR #$PR_NUMBER is $pr_state; out of scope for the merge gate. Publishing nothing."
            exit 0
          fi

          author_is_trusted() {
            local candidate="$1" item
            local -a items
            IFS=',' read -r -a items <<<"$TRUSTED_REVIEW_AUTHORS"
            for item in "${items[@]}"; do
              if [ "$item" = "$candidate" ]; then
                return 0
              fi
            done
            return 1
          }

          # Formal reviews bound to the exact current head.
          reviews_tsv="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq '.[] | [(.user.login // ""), (.commit_id // ""), (.state // ""), (.submitted_at // "")] | @tsv')"
          trusted_reviews=0
          untrusted_reviews=0
          trusted_detail=""
          while IFS=$'\t' read -r author commit_oid review_state submitted_at || [ -n "$author" ]; do
            [ -n "$author" ] || continue
            [ "$commit_oid" = "$head_sha" ] || continue
            if author_is_trusted "$author"; then
              trusted_reviews=$((trusted_reviews + 1))
              if [ -z "$trusted_detail" ]; then
                trusted_detail="@$author ($review_state) at $submitted_at"
              fi
            else
              untrusted_reviews=$((untrusted_reviews + 1))
            fi
          done <<<"$reviews_tsv"

          # Base binding recorded on the head by scripts/open-pr.sh.
          statuses_tsv="$(gh api --paginate "repos/$REPO/commits/$head_sha/statuses?per_page=100" \
            --jq '.[] | [(.context // ""), (.state // ""), ((.description // "") | gsub("[\r\n\t]"; " "))] | @tsv')"
          bound_bases=""
          while IFS=$'\t' read -r context status_state description || [ -n "$context" ]; do
            [ "$context" = "$INTENT_STATUS_CONTEXT" ] || continue
            [ "$status_state" = "success" ] || continue
            case "$description" in
              pr=*' base='*) ;;
              *) continue ;;
            esac
            request_pr="${description#pr=}"
            request_pr="${request_pr%% base=*}"
            request_base="${description#* base=}"
            [ "$request_pr" = "$PR_NUMBER" ] || continue
            case ",$bound_bases," in
              *",$request_base,"*) ;;
              *) bound_bases="${bound_bases}${bound_bases:+,}$request_base" ;;
            esac
          done <<<"$statuses_tsv"

          reasons=""
          add_reason() {
            reasons="${reasons}${reasons:+$'\n'}- $1"
          }
          if [ "$trusted_reviews" -eq 0 ]; then
            if [ "$untrusted_reviews" -gt 0 ]; then
              add_reason "the only review evidence at head \`$head_sha\` is from untrusted author(s) ($untrusted_reviews review(s) not on the allowlist: $TRUSTED_REVIEW_AUTHORS)"
            else
              add_reason "no trusted-author review exists for head \`$head_sha\`"
            fi
          fi
          if [ -z "$bound_bases" ]; then
            add_reason "no base binding: no successful \`$INTENT_STATUS_CONTEXT\` status on head \`$head_sha\` records \`pr=$PR_NUMBER base=<oid>\`"
          elif [ "${bound_bases#*,}" != "$bound_bases" ]; then
            add_reason "conflicting base bindings on head \`$head_sha\`: \`$bound_bases\` (current base \`$base_ref\` is at \`$base_oid\`)"
          elif [ "$bound_bases" != "$base_oid" ]; then
            add_reason "base binding mismatch: review was requested against base \`$bound_bases\`, but PR #$PR_NUMBER now targets \`$base_ref\` at \`$base_oid\`"
          fi

          external_id=""
          case "$bound_bases" in
            *,*) : ;;
            ?*) external_id="$bound_bases" ;;
          esac

          coords=$'\n'"- head: \`$head_sha\`"$'\n'"- current base: \`$base_ref\` @ \`$base_oid\`"
          footer=$'\n\n'"This check answers \"was this exact artifact reviewed\", never \"was it approved\"; unresolved findings are enforced by required conversation resolution, not here (#726)."
          if [ -z "$reasons" ]; then
            conclusion="success"
            title="Reviewed at this head, bound to the current base"
            summary="A trusted-author review exists for the exact current head, and the recorded base binding matches the PR's current base.$coords"$'\n'"- trusted review: $trusted_detail (trusted reviews at this head: $trusted_reviews)$footer"
          else
            conclusion="failure"
            title="Not reviewed at this head+base"
            summary="This head+base pair has no binding trusted-review evidence:"$'\n\n'"$reasons"$'\n'"$coords"$'\n\n'"To turn this green, request a trusted review for this exact head (bash scripts/open-pr.sh) and let it complete.$footer"
          fi

          run_id="$(gh api -X POST "repos/$REPO/check-runs" \
            -f name=review-binding \
            -f head_sha="$head_sha" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f external_id="$external_id" \
            -f "output[title]=$title" \
            -f "output[summary]=$summary" \
            --jq '.id')"
          echo "Published check-run review-binding id=$run_id conclusion=$conclusion head=$head_sha bound_base=${external_id:-<none>}"
