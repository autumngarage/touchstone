name: validate

# The one check that proves the tests actually passed.
#
# Before this existed, the entire 43-file fast tier ran only on the author's
# machine, in the agent's own process, and was reported by that same agent.
# Nothing independently verified it, and `required_status_checks` was empty —
# so "bad code cannot reach main" was enforced by nothing.
#
# It is deliberately the same command a developer runs locally, with no CI-only
# variations: one code path, so a green run here means the same thing as a green
# run there.
#
# NOT YET SAFE TO REQUIRE. A `pull_request` run evaluates the workflow
# definition proposed BY the pull request, so once `validate` is a required
# status check, a PR can edit this file down to a job named `validate` that
# exits 0 and satisfy its own gate. With no human reading diffs, the checks are
# the entire quality bar, so a self-editable gate is not a gate. Making this
# required is tracked in #727, which must first pin the required run to a
# workflow definition outside the PR's control. Until then this reports; it
# does not enforce.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref. Without this,
# a rebase-and-reship leaves the old run racing the new one, and the merge
# gate can bind to whichever finishes last.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    # Derived from measurement, not from a round number. The suite ran 1,233s
    # on a comparable Linux runner even with test-bootstrap.sh excluded, and
    # test-bootstrap.sh alone exceeds five minutes — so a full green run is
    # ~30 minutes. The loop deliberately continues past individual failures,
    # which makes an under-set timeout worse than useless: Actions would kill
    # it mid-suite and the later test files would never report at all.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The fast tier exercises real git history in temp repos; a shallow
          # clone is fine, but the tests need a usable git identity.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "ci@touchstone.invalid"
          git config --global user.name "Touchstone CI"
          git config --global init.defaultBranch main

      - name: Install test dependencies
        run: |
          # jq is used by the hook tests; shellcheck and shfmt by preflight.
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq shellcheck
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version
          # pre-commit is a REQUIREMENT of the suite, not a lint convenience.
          # bootstrap and update install git hooks through it, and without it
          # `update --ship` stops at "effective hooks are not ready" — so the
          # ship-failure case never reaches the step it means to exercise and
          # fails for an unrelated reason.
          #
          # Installed with pipx, not `pip --user`. The latter put a shim on PATH
          # whose interpreter could not import its own package:
          #   ModuleNotFoundError: No module named 'pre_commit'
          # pipx builds an isolated venv and a shim pinned to that venv's
          # interpreter, so the console script always resolves.
          pipx install pre-commit
          pre-commit --version

      # No `env:` block here, deliberately. Setting TOUCHSTONE_NO_AUTO_UPDATE=1
      # for the whole loop disables the very behaviour tests/test-auto-update.sh
      # asserts, so that file fails with "expected brew upgrade followed by CLI
      # re-exec" on every run. The tests already fake their own updater and
      # sync, and the fast tier is green locally with neither variable set — so
      # exporting them here was a CI-only variation of exactly the kind the
      # header of this file rules out. One code path.
      - name: Run the fast tier
        run: |
          set -euo pipefail
          failed=0
          for t in tests/test-*.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$t::$t failed"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "$failed test file(s) failed"
            exit 1
          fi
          echo "fast tier green"
