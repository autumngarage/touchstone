name: validate

# The organization ruleset pins an immutable revision of this required
# workflow. It answers exactly one question: did the test suite run and pass
# on this exact commit?
#
# Everything else is enforced by native rules and the separate review-binding
# check. Re-implementing those decisions here is what grew the previous
# 283-line workflow that was deleted.
#
# DEPENDENCY CONTRACT: this job may depend on the runner image, this
# repository, and github.com. Nothing else. Anything no test executes is not
# installed here.
#
# That contract is now actually kept. The old version preached it in a header
# while installing pre-commit from PyPI on every run, and on 2026-08-12 two
# third-party 503s turned the required check red while fetching shellcheck and
# shfmt — no test ran either time (#742, #803, #808). No surviving test invokes
# pre-commit, shellcheck or shfmt, so nothing is fetched at all: this job cannot
# go red for a reason outside this repository. The review-binding fixtures do
# execute the runner-provided jq binary; `setup.sh` installs the same declared
# local tool. Lint runs at pre-commit and via `pre-commit run --all-files` — a
# different gate, off the merge path.
#
# Before adding an install step here, name the test that executes the binary.
# If you cannot name one, the dependency belongs at pre-commit time.
#
# Keep the job name stable so runs remain legible and the stored rollback
# policy can restore its historical status-check context exactly.

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run for the same ref. Without this, a
# rebase-and-reship leaves the old run racing the new one, and the merge gate
# can bind to whichever finishes last.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: validate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        # Pinned to a full commit SHA, not a tag: only a SHA is an immutable
        # reference, and this action runs on the merge path.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The suite exercises real git history in temp repos.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "ci@touchstone.invalid"
          git config --global user.name "Touchstone CI"
          git config --global init.defaultBranch main

      - name: Run the test suite
        run: |
          set -uo pipefail
          failed=0
          for t in tests/test-*.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS $t"
            else
              echo "::error file=$t::test file failed"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "$failed test file(s) failed"
            exit 1
          fi
          echo "suite green"
