name: Deterministic preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  deterministic-preflight-v1:
    name: deterministic-preflight-v1
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install deterministic checkers
        run: |
          brew install actionlint shellcheck shfmt
          npm install --global markdownlint-cli2

      - name: Verify exact revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"

      - name: Run deterministic preflight
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash lib/preflight.sh --diff "$BASE_SHA" "$GITHUB_WORKSPACE"
