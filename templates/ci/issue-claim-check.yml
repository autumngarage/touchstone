name: Issue claim check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: read
  pull-requests: write
  contents: read

concurrency:
  group: >-
    claim-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claim-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted claim-check helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .touchstone-claim-base

      - name: Enforce claim-before-dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          helper=".touchstone-claim-base/scripts/issue-claim-check.sh"
          if [ ! -f "$helper" ]; then
            echo "Trusted base helper is unavailable; skipping transition run instead of executing PR-controlled code."
            exit 0
          fi
          rc=0
          bash "$helper" --pr-number "$PR_NUMBER" --comment-pr || rc=$?
          # Exit 3 means the helper found closing references but this project's
          # tracker has no verification transport, so it checked nothing. That
          # is a green check that verified nothing: allowed, because there is
          # no question the runner could answer, but never silent. Deciding it
          # here — rather than returning 0 from the helper — keeps the "nothing
          # was enforced" state visible in the run and readable by every other
          # caller of the same exit code.
          if [ "$rc" -eq 3 ]; then
            echo "::notice::Claim ownership was NOT verified: this project's issue tracker has no verification transport. The references the helper listed are yours to confirm."
            exit 0
          fi
          exit "$rc"
