# Touchstone-provided starter CI workflow. Runs the same pre-commit hygiene
# checks and `scripts/touchstone-run.sh validate` path that gate local pre-push.
# A CI failure here means the same thing a pre-push rejection would mean locally.
#
# `touchstone-run.sh validate` silently skips when profile linters/tests are
# absent (correct runtime UX). In CI that's useless — install your profile's
# toolchain in the block below before the validate step, or CI will pass on
# gaps pre-push would catch.

name: validate

# pull_request only: the Touchstone merge gate already validated the exact
# merged head locally, so a push trigger on the default branch would bill a
# second full run for content that cannot have changed. CI here is the
# backstop for hookless contributors, not a second source of truth.
on:
  pull_request:

# One live run per PR: a superseded head's validation is worthless, and
# multi-round review PRs would otherwise bill a full run per obsolete head.
# Keyed by PR NUMBER, not head_ref: two PRs from same-named branches (fork
# `main` vs fork `main`) share a head_ref and would cancel each other's runs.
# The literal touchstone-validate namespace is unique to THIS file — another
# workflow that also sets `name: validate` would make github.workflow
# collide and cancel unrelated runs for the same PR.
concurrency:
  group: touchstone-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # --- Add profile-specific toolchain steps here ---
      # Node:
      #   - uses: actions/setup-node@v4
      #     with:
      #       node-version: '20'
      #       cache: 'pnpm'
      # Python:
      #   - uses: actions/setup-python@v5
      #     with:
      #       python-version: '3.12'
      # Rust:
      #   - uses: dtolnay/rust-toolchain@stable
      # Go:
      #   - uses: actions/setup-go@v5
      #     with:
      #       go-version: '1.23'
      # Swift:
      #   - uses: swift-actions/setup-swift@v2

      # Pinned. Unpinned, this job's verdict depends on whichever release PyPI
      # serves that morning — a version nobody chose, arriving with no diff.
      # Bump it deliberately; that bump is then a reviewable change like any
      # other. (Touchstone's own validate workflow pins the same version.)
      - name: Install pre-commit
        run: pipx install "pre-commit==4.6.2"

      # This clones and builds every hook repo in .pre-commit-config.yaml at
      # job time, so each one is a third-party service on your merge path. If
      # this check is required, a bad minute at any of those hosts blocks every
      # merge — and the failure arrives looking like a code failure. Two such
      # outages hit Touchstone's own required check in a single day
      # (autumngarage/touchstone#742).
      #
      # Cheapest fix, when it starts costing you: cache pre-commit's hook
      # environments (actions/cache on ~/.cache/pre-commit, keyed by a hash of
      # .pre-commit-config.yaml). Do not answer an infrastructure failure by
      # making the check non-blocking — a check that goes green when it could
      # not look is worse than no check.
      - name: Run pre-commit hygiene
        run: pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure

      - name: Run touchstone validate
        run: bash scripts/touchstone-run.sh validate
